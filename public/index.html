const STORE_MAP = { wholeFoods: "Whole Foods", traderjoes: "Trader Joe's", costco: "Costco", target: "Target", walmart: "Walmart", kroger: "Kroger", amazon: "Amazon" };

const STORE_ICONS = {
  "Whole Foods": "🌿", "Trader Joe's": "🛒", "Costco": "📦", "Target": "🎯",
  "Walmart": "🔵", "Kroger": "🏬", "Safeway": "🛍️", "Aldi": "🟡", "Publix": "🦢",
  "Stop & Shop": "🛒", "ShopRite": "🏪", "H Mart": "🌏", "Sprouts": "🌱",
  "Wegmans": "🏬", "Market Basket": "🧺", "Amazon": "📬",
};

function StoresStep({ location, selectedStores, setSelectedStores }) {
  const [nearbyStores, setNearbyStores] = useState(null);
  const [loading, setLoading] = useState(true);
  const [customInput, setCustomInput] = useState("");
  const [customStores, setCustomStores] = useState([]);
  const [showCustom, setShowCustom] = useState(false);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
          "Content-Type": "application/json",
          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 400,
            messages: [{
              role: "user",
              content: `List the 6 most common grocery stores near ${location}. Return ONLY a JSON array of store names, no other text. Example: ["Whole Foods","Trader Joe's","Costco","Target","Safeway","Aldi"]. Only include stores that are realistically present in that area.`
            }]
          })
        });
        const data = await res.json();
        const text = data.content?.[0]?.text || "[]";
        const clean = text.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(clean);
        setNearbyStores(parsed.slice(0, 6));
      } catch {
        setNearbyStores(["Whole Foods", "Trader Joe's", "Costco", "Target", "Walmart", "Kroger"]);
      }
      setLoading(false);
    })();
  }, [location]);

  const allStores = [...(nearbyStores || []), ...customStores];

  const toggle = (name) => {
    setSelectedStores(prev =>
      prev.includes(name) ? prev.filter(s => s !== name) : [...prev, name]
    );
  };

  const addCustom = () => {
    const val = customInput.trim();
    if (val && !allStores.includes(val)) {
      setCustomStores(p => [...p, val]);
      setSelectedStores(p => [...p, val]);
    }
    setCustomInput("");
  };

  if (loading) {
    return (
      <div style={{ textAlign: "center", padding: "32px 0" }}>
        <div style={{ color: COLORS.accent, fontSize: 28, marginBottom: 12 }}>📍</div>
        <div style={{ color: COLORS.text, fontWeight: 600, fontSize: 14, marginBottom: 6 }}>Finding stores near {location}…</div>
        <div style={{ color: COLORS.muted, fontSize: 12 }}>Looking up what's in your area</div>
        <div style={{ marginTop: 16, display: "flex", justifyContent: "center", gap: 6 }}>
          {[0,1,2].map(i => (
            <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.accent, opacity: 0.3 + i * 0.3 }} />
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      {/* Nearby stores section */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>
          📍 Near {location}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {nearbyStores.map(store => {
            const active = selectedStores.includes(store);
            const icon = STORE_ICONS[store] || "🏪";
            return (
              <button key={store} onClick={() => toggle(store)}
                style={{ padding: "10px 16px", borderRadius: 10, cursor: "pointer", border: `1px solid ${active ? COLORS.accent : COLORS.border}`, background: active ? COLORS.accentDim : COLORS.surfaceAlt, color: active ? COLORS.accent : COLORS.text, fontFamily: "inherit", fontSize: 13, fontWeight: active ? 700 : 400, transition: "all 0.15s", display: "flex", alignItems: "center", gap: 7 }}>
                {icon} {store}
                {active && <span style={{ fontSize: 10 }}>✓</span>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Custom stores section */}
      {customStores.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>
            ➕ Added by you
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {customStores.map(store => {
              const active = selectedStores.includes(store);
              return (
                <button key={store} onClick={() => toggle(store)}
                  style={{ padding: "10px 16px", borderRadius: 10, cursor: "pointer", border: `1px solid ${active ? COLORS.blue : COLORS.border}`, background: active ? COLORS.blueDim : COLORS.surfaceAlt, color: active ? COLORS.blue : COLORS.text, fontFamily: "inherit", fontSize: 13, fontWeight: active ? 700 : 400, transition: "all 0.15s", display: "flex", alignItems: "center", gap: 7 }}>
                  🏪 {store}
                  {active && <span style={{ fontSize: 10 }}>✓</span>}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Add custom store */}
      {!showCustom ? (
        <button onClick={() => setShowCustom(true)}
          style={{ background: "none", border: `1px dashed ${COLORS.border}`, borderRadius: 8, padding: "7px 14px", color: COLORS.muted, fontFamily: "inherit", fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
          + Add a store not listed
        </button>
      ) : (
        <div style={{ display: "flex", gap: 8 }}>
          <input
            value={customInput}
            onChange={e => setCustomInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && addCustom()}
            placeholder="e.g. H Mart, Wegmans, Aldi…"
            autoFocus
            style={{ flex: 1, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.blue}55`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }}
          />
          <button onClick={addCustom}
            style={{ background: COLORS.blueDim, border: `1px solid ${COLORS.blue}`, color: COLORS.blue, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 700 }}>
            Add
          </button>
          <button onClick={() => setShowCustom(false)}
            style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 8, padding: "8px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>
            ✕
          </button>
        </div>
      )}

      {/* Selection summary */}
      {selectedStores.length > 0 && (
        <div style={{ marginTop: 14, color: COLORS.muted, fontSize: 12 }}>
          {selectedStores.length} store{selectedStores.length > 1 ? "s" : ""} selected
          <span style={{ color: COLORS.accent, marginLeft: 6 }}>
            {selectedStores.join(" · ")}
          </span>
        </div>
      )}
    </div>
  );
}

function SavingsQuiz({ onComplete }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({ location: "", stores: [], detour: "", savingsGoal: "", diyWillingness: "", brandLoyalty: "" });
  const current = QUIZ_STEPS[step];
  const progress = (step / QUIZ_STEPS.length) * 100;

  const canAdvance = () => {
    if (current.type === "city") return answers.location.trim().length > 0;
    if (current.type === "stores_dynamic") return answers.stores.length > 0;
    return !!answers[current.id];
  };

  const next = () => step < QUIZ_STEPS.length - 1 ? setStep(s => s + 1) : onComplete(answers);

  return (
    <div style={{ maxWidth: 540, margin: "0 auto", paddingTop: 8 }}>
      {/* Progress */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 32 }}>
        <div style={{ flex: 1, height: 3, background: COLORS.border, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${progress}%`, background: COLORS.accent, borderRadius: 4, transition: "width 0.3s ease" }} />
        </div>
        <span style={{ color: COLORS.muted, fontSize: 11, whiteSpace: "nowrap" }}>{step + 1} of {QUIZ_STEPS.length}</span>
      </div>

      {/* Question header */}
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div style={{ fontSize: 40, marginBottom: 12 }}>{current.icon}</div>
        <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800, marginBottom: 8, lineHeight: 1.3 }}>{current.title}</h2>
        <p style={{ color: COLORS.muted, fontSize: 13 }}>{current.subtitle}</p>
      </div>

      {/* City input */}
      {current.type === "city" && (
        <input value={answers.location} onChange={e => setAnswers(p => ({ ...p, location: e.target.value }))}
          onKeyDown={e => e.key === "Enter" && canAdvance() && next()} placeholder="e.g. New York, NY or 10001"
          style={{ width: "100%", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.accent}55`, borderRadius: 10, padding: "12px 16px", color: COLORS.text, fontFamily: "inherit", fontSize: 15, outline: "none", textAlign: "center", marginBottom: 24 }} autoFocus />
      )}

      {/* Dynamic stores step */}
      {current.type === "stores_dynamic" && (
        <div style={{ marginBottom: 24 }}>
          <StoresStep
            location={answers.location}
            selectedStores={answers.stores}
            setSelectedStores={(updater) => setAnswers(p => ({ ...p, stores: typeof updater === "function" ? updater(p.stores) : updater }))}
          />
        </div>
      )}

      {/* Single-select */}
      {current.type === "single" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
          {current.options.map(opt => {
            const active = answers[current.id] === opt.id;
            return (
              <div key={opt.id} onClick={() => setAnswers(p => ({ ...p, [current.id]: opt.id }))}
                style={{ padding: "12px 16px", borderRadius: 10, cursor: "pointer", border: `1px solid ${active ? COLORS.accent : COLORS.border}`, background: active ? COLORS.accentDim : COLORS.surfaceAlt, transition: "all 0.15s", display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${active ? COLORS.accent : COLORS.border}`, background: active ? COLORS.accent : "transparent", flexShrink: 0, transition: "all 0.15s" }} />
                <div>
                  <div style={{ color: active ? COLORS.accent : COLORS.text, fontWeight: active ? 700 : 500, fontSize: 14 }}>{opt.label}</div>
                  {opt.desc && <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>{opt.desc}</div>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Nav */}
      <div style={{ display: "flex", gap: 10 }}>
        {step > 0 && <button onClick={() => setStep(s => s - 1)} style={{ padding: "11px 20px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 13, fontWeight: 600 }}>← Back</button>}
        <button onClick={next} disabled={!canAdvance()}
          style={{ flex: 1, padding: "11px", borderRadius: 10, cursor: canAdvance() ? "pointer" : "default", border: `1px solid ${canAdvance() ? COLORS.accent : COLORS.border}`, background: canAdvance() ? COLORS.accentDim : COLORS.surfaceAlt, color: canAdvance() ? COLORS.accent : COLORS.muted, fontFamily: "inherit", fontSize: 14, fontWeight: 700, transition: "all 0.15s" }}>
          {step === QUIZ_STEPS.length - 1 ? "Show My Savings →" : "Next →"}
        </button>
      </div>

      {/* Step dots */}
      <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 20 }}>
        {QUIZ_STEPS.map((_, i) => <div key={i} style={{ width: i === step ? 18 : 6, height: 6, borderRadius: 3, background: i <= step ? COLORS.accent : COLORS.border, transition: "all 0.2s" }} />)}
      </div>
    </div>
  );
}

// Seed items representing a typical Whole Foods shopper — in a real app
// these come from the user's scanned receipts.
const SEED_ITEMS = [
  "Siggi's Vanilla Yogurt 4pk", "Pre-cut Stir Fry Veg Mix", "Kind Dark Chocolate Bar x3",
  "RXBar 12pk", "Almond Butter 16oz", "Organic Baby Spinach 5oz",
  "Organic Chicken Breast 2lb", "Wild Salmon Fillet 1lb", "Oat Milk 32oz x2",
  "Organic Olive Oil 16oz", "Cage Free Eggs 12ct", "Kombucha 4pk",
];

function SavingsTab({ dietary, savingsProfile, setSavingsProfile, shoppingList, setShoppingList, receipts = [] }) {
  const [quizDone, setQuizDone] = useState(!!savingsProfile);
  const [generating, setGenerating] = useState(false);
  const [swaps, setSwaps] = useState([]);
  const [feedback, setFeedback] = useState({});
  const [dismissing, setDismissing] = useState(null);

  const DISMISS_REASONS = [
    { id: "wrong_store", label: "Store not convenient" },
    { id: "brand",       label: "I prefer my current brand" },
    { id: "tried",       label: "Already tried it, didn't like it" },
    { id: "effort",      label: "Too much effort" },
    { id: "quality",     label: "Worried about quality" },
    { id: "other",       label: "Something else" },
  ];

  // Generate swaps via AI whenever the profile is set
  // Pull item names from real scanned receipts, fall back to seed items
  const receiptItems = [...new Set(
    receipts.flatMap(r => (r.items || []).map(i => i.name)).filter(Boolean)
  )].slice(0, 30);

  const generateSwaps = async (profile) => {
    setGenerating(true);
    setSwaps([]);

    const storeList = profile.stores?.length
      ? profile.stores.join(", ")
      : "any nearby grocery store";

    const detourDesc = {
      none: "only at my usual store",
      close: "at stores within a short detour",
      planned: "willing to make a planned trip",
      any: "happy to go to any store for a good deal",
    }[profile.detour] || "flexible";

    const diyDesc = {
      never: "no DIY — ready-to-eat only",
      quick: "willing to do up to 5 minutes of prep",
      moderate: "happy to cook up to 30 minutes",
      enthusiast: "loves cooking, batch prep welcome",
    }[profile.diyWillingness] || "flexible";

    const dietStr = dietary.length > 0 ? `Dietary restrictions: ${dietary.join(", ")}.` : "";

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: {
          "Content-Type": "application/json",
          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 2500,
          messages: [{ role: "user", content:
`You are a grocery savings advisor. Generate 8 realistic product substitution recommendations for a shopper near ${profile.location || "a US city"}.

Available stores: ${storeList}
Shopping radius: ${detourDesc}
DIY willingness: ${diyDesc}
${dietStr}

Base recommendations on these purchases from the user's receipt history:
${receiptItems.length > 0 ? receiptItems.join(", ") : SEED_ITEMS.join(", ")}

Rules:
- Only recommend swaps at stores from the available stores list (or "Any" for widely available items, or "DIY" for home prep)
- Respect the DIY willingness — do not suggest DIY if "no DIY"
- All swaps must be compatible with dietary restrictions
- Each swap must be a genuine, concrete product (real brand names, real store SKUs)
- Savings must be realistic — don't exaggerate

Return ONLY a JSON array, no markdown:
[{
  "id": 1,
  "original": "product currently buying",
  "originalPrice": 0.00,
  "sub": "specific substitute product",
  "subPrice": 0.00,
  "savings": 0.00,
  "store": "store name exactly as given, or Any, or DIY",
  "nutritionMatch": 85-100,
  "reason": "one concrete sentence explaining the swap value",
  "badge": "2-3 word label e.g. Best Value / Bulk Save / Quick DIY",
  "isDIY": false,
  "diyMinutes": 0,
  "compatible": ["gluten-free", "vegan", "vegetarian", "keto", "paleo", "dairy-free", "nut-free"]
}]`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.[0]?.text || "[]";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setSwaps(parsed.map((s, i) => ({ ...s, id: s.id ?? i + 1 })));
    } catch (e) {
      console.error(e);
      setSwaps([]);
    }
    setGenerating(false);
  };

  const handleComplete = (answers) => {
    setSavingsProfile(answers);
    setQuizDone(true);
    generateSwaps(answers);
  };

  // If profile already existed on mount, generate on first render
  useEffect(() => {
    if (savingsProfile && swaps.length === 0 && !generating) {
      generateSwaps(savingsProfile);
    }
  }, []);

  const markTry = (sub) => {
    setFeedback(p => ({ ...p, [sub.id]: "try" }));
    setDismissing(null);
    setShoppingList(prev => {
      if (prev.find(i => i.subId === sub.id)) return prev;
      return [...prev, {
        id: Date.now(), subId: sub.id,
        name: sub.sub, store: sub.store === "DIY" ? "Home" : sub.store,
        price: sub.subPrice, savings: sub.savings,
        isDIY: sub.isDIY, diyMinutes: sub.diyMinutes,
        replaces: sub.original, checked: false,
      }];
    });
  };

  const markSkip = (id, reason) => { setFeedback(p => ({ ...p, [id]: "skip", [`${id}_reason`]: reason })); setDismissing(null); };
  const markLater = (id) => { setFeedback(p => ({ ...p, [id]: "later" })); setDismissing(null); };

  const active  = swaps.filter(s => feedback[s.id] !== "skip");
  const skipped = swaps.filter(s => feedback[s.id] === "skip");
  const tried   = swaps.filter(s => feedback[s.id] === "try");
  const potentialSavings = active.reduce((a, s) => a + s.savings, 0);
  const lockedSavings    = tried.reduce((a, s) => a + s.savings, 0);

  const diyLabel    = { never: "No DIY", quick: "Quick prep only", moderate: "Some cooking", enthusiast: "Full cook" };
  const detourLabel = { none: "Same store", close: "Short detour", planned: "Planned trip", any: "Any store" };

  if (!quizDone) return (
    <div style={{ maxWidth: 600 }}>
      <div style={{ marginBottom: 28 }}>
        <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Personalize Your Savings</h2>
        <p style={{ color: COLORS.muted, fontSize: 14 }}>Answer 6 quick questions so we can show savings that actually fit your life.</p>
      </div>
      <SavingsQuiz onComplete={handleComplete} />
    </div>
  );

  return (
    <div style={{ maxWidth: 700 }}>
      {/* Profile strip */}
      <div style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "12px 16px", marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center" }}>
          {savingsProfile.location && <span style={{ color: COLORS.text, fontSize: 12 }}>📍 {savingsProfile.location}</span>}
          {savingsProfile.detour && <><span style={{ color: COLORS.border }}>·</span><span style={{ color: COLORS.text, fontSize: 12 }}>🚗 {detourLabel[savingsProfile.detour]}</span></>}
          {savingsProfile.diyWillingness && <><span style={{ color: COLORS.border }}>·</span><span style={{ color: COLORS.text, fontSize: 12 }}>👨‍🍳 {diyLabel[savingsProfile.diyWillingness]}</span></>}
          {savingsProfile.stores?.length > 0 && <><span style={{ color: COLORS.border }}>·</span><span style={{ color: COLORS.muted, fontSize: 12 }}>{savingsProfile.stores.length} store{savingsProfile.stores.length > 1 ? "s" : ""}</span></>}
        </div>
        <button onClick={() => { setSavingsProfile(null); setQuizDone(false); setSwaps([]); }}
          style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 600 }}>
          ✏️ Retake quiz
        </button>
      </div>

      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
        <div>
          <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800 }}>Your Savings Opportunities</h2>
          <p style={{ color: COLORS.muted, fontSize: 13, marginTop: 4 }}>Personalized to your stores, schedule, and cooking style</p>
        </div>
        <div style={{ textAlign: "right" }}>
          {lockedSavings > 0 && <div style={{ color: COLORS.accent, fontSize: 13, fontWeight: 700, marginBottom: 2 }}>✓ {fmt(lockedSavings)} locked in</div>}
          <div style={{ color: COLORS.blue, fontSize: 24, fontWeight: 800 }}>{fmt(potentialSavings)}</div>
          <div style={{ color: COLORS.muted, fontSize: 11 }}>still available</div>
        </div>
      </div>

      {/* Loading state */}
      {generating && (
        <Card style={{ textAlign: "center", padding: "48px 32px" }}>
          <div style={{ fontSize: 36, marginBottom: 14 }}>🔍</div>
          <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 15, marginBottom: 6 }}>Finding your savings…</div>
          <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 20 }}>
            Checking prices at {savingsProfile.stores?.slice(0,3).join(", ") || "nearby stores"}
          </div>
          <div style={{ height: 4, background: COLORS.border, borderRadius: 4, maxWidth: 280, margin: "0 auto" }}>
            <div style={{ height: "100%", width: "65%", background: COLORS.accent, borderRadius: 4 }} />
          </div>
        </Card>
      )}

      {/* Empty state after generation */}
      {!generating && swaps.length === 0 && (
        <Card style={{ textAlign: "center", padding: 40 }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>🤷</div>
          <div style={{ color: COLORS.text, fontWeight: 700, marginBottom: 6 }}>Couldn't generate swaps</div>
          <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 16 }}>This can happen if the AI response failed to parse. Try again.</div>
          <button onClick={() => generateSwaps(savingsProfile)}
            style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, borderRadius: 8, padding: "8px 20px", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700 }}>
            Try again
          </button>
        </Card>
      )}

      {/* Swap cards */}
      {!generating && active.map(s => {
        const fb = feedback[s.id];
        const isTried = fb === "try";
        const isLater = fb === "later";
        const isDismissOpen = dismissing === s.id;

        return (
          <div key={s.id} style={{ marginBottom: 14 }}>
            <Card style={{
              position: "relative", overflow: "visible",
              border: `1px solid ${isTried ? COLORS.accent : COLORS.border}`,
              background: isTried ? COLORS.accentDim : COLORS.surface,
              opacity: isLater ? 0.6 : 1, transition: "all 0.2s",
            }}>
              <div style={{ position: "absolute", top: 0, right: 0, background: s.isDIY ? COLORS.warn : COLORS.accent, color: "#000", fontSize: 10, fontWeight: 800, padding: "4px 12px", borderBottomLeftRadius: 8, letterSpacing: "0.06em" }}>{s.badge}</div>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 14 }}>
                <div style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ color: COLORS.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 3 }}>Currently Buying</div>
                  <div style={{ color: COLORS.text, fontWeight: 600, fontSize: 14 }}>{s.original}</div>
                  <div style={{ color: COLORS.danger, fontWeight: 800, fontSize: 18, marginTop: 2 }}>{fmt(s.originalPrice)}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", color: COLORS.muted, fontSize: 18 }}>→</div>
                <div style={{ flex: 1, minWidth: 150 }}>
                  <div style={{ color: COLORS.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 3 }}>{s.isDIY ? "DIY Alternative" : "Suggested Swap"}</div>
                  <div style={{ color: COLORS.text, fontWeight: 600, fontSize: 14 }}>{s.sub}</div>
                  <div style={{ color: COLORS.accent, fontWeight: 800, fontSize: 18, marginTop: 2 }}>{fmt(s.subPrice)}</div>
                </div>
              </div>
              <div style={{ background: COLORS.surfaceAlt, borderRadius: 8, padding: "10px 14px", marginBottom: 12, display: "flex", gap: 20, flexWrap: "wrap" }}>
                <div><div style={{ color: COLORS.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>You Save</div><div style={{ color: COLORS.accent, fontWeight: 800, fontSize: 16 }}>{fmt(s.savings)}</div></div>
                <div><div style={{ color: COLORS.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>Nutrition Match</div><div style={{ color: s.nutritionMatch >= 95 ? COLORS.accent : COLORS.warn, fontWeight: 800, fontSize: 16 }}>{s.nutritionMatch}%</div></div>
                <div><div style={{ color: COLORS.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>{s.isDIY ? "Prep Time" : "Where to Buy"}</div><div style={{ color: s.isDIY ? COLORS.warn : COLORS.blue, fontWeight: 700, fontSize: 14 }}>{s.isDIY ? `~${s.diyMinutes} min` : s.store}</div></div>
              </div>
              <div style={{ color: COLORS.muted, fontSize: 13, lineHeight: 1.6, marginBottom: 14 }}>💡 {s.reason}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
                {(s.compatible || []).slice(0, 4).map(d => <Tag key={d} color={COLORS.blue}>{d}</Tag>)}
                {s.isDIY && <Tag color={COLORS.warn}>DIY</Tag>}
              </div>

              {/* Feedback row */}
              {!isTried ? (
                <div style={{ display: "flex", gap: 8, borderTop: `1px solid ${COLORS.border}`, paddingTop: 12 }}>
                  <button onClick={() => markTry(s)}
                    style={{ flex: 2, padding: "9px 0", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.accent}`, background: COLORS.accentDim, color: COLORS.accent, fontFamily: "inherit", fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                    👍 I'll try it <span style={{ fontSize: 10, opacity: 0.7 }}>+ adds to list</span>
                  </button>
                  <button onClick={() => markLater(s.id)}
                    style={{ flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
                    ⏭ Later
                  </button>
                  <button onClick={() => setDismissing(isDismissOpen ? null : s.id)}
                    style={{ flex: 1, padding: "9px 0", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: isDismissOpen ? COLORS.surfaceAlt : "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
                    👎 No
                  </button>
                </div>
              ) : (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: `1px solid ${COLORS.accent}44`, paddingTop: 12 }}>
                  <span style={{ color: COLORS.accent, fontSize: 13, fontWeight: 700 }}>✓ Added to shopping list</span>
                  <button onClick={() => setFeedback(p => { const n = {...p}; delete n[s.id]; return n; })}
                    style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11 }}>Undo</button>
                </div>
              )}
            </Card>

            {/* Dismiss reason panel */}
            {isDismissOpen && (
              <div style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "14px 16px", marginTop: -6 }}>
                <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>Why isn't this a fit?</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                  {DISMISS_REASONS.map(r => (
                    <button key={r.id} onClick={() => markSkip(s.id, r.id)}
                      style={{ padding: "6px 12px", borderRadius: 20, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: COLORS.surface, color: COLORS.text, fontFamily: "inherit", fontSize: 12 }}>
                      {r.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Dismissed */}
      {!generating && skipped.length > 0 && (
        <details style={{ marginTop: 8 }}>
          <summary style={{ color: COLORS.muted, fontSize: 12, cursor: "pointer", padding: "8px 0", listStyle: "none", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 10 }}>▶</span> {skipped.length} dismissed swap{skipped.length > 1 ? "s" : ""}
          </summary>
          <div style={{ marginTop: 10 }}>
            {skipped.map(s => (
              <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: COLORS.surfaceAlt, borderRadius: 8, marginBottom: 6, opacity: 0.6 }}>
                <div>
                  <div style={{ color: COLORS.text, fontSize: 13 }}>{s.original} → {s.sub}</div>
                  <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 2 }}>
                    {DISMISS_REASONS.find(r => r.id === feedback[`${s.id}_reason`])?.label || "Dismissed"}
                  </div>
                </div>
                <button onClick={() => setFeedback(p => { const n = {...p}; delete n[s.id]; delete n[`${s.id}_reason`]; return n; })}
                  style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11 }}>
                  Reconsider
                </button>
              </div>
            ))}
          </div>
        </details>
      )}
    </div>
  );
}

  "Whole Foods": "🌿", "Trader Joe's": "🛒", "Costco": "📦",
  "Target": "🎯", "Walmart": "🔵", "Home": "👨‍🍳", "Any": "🏪",

  "Kroger": "🏬", "Wegmans": "🏬", "Amazon": "📬",
};

const CATEGORY_ICONS = {
  "Produce": "🥦", "Dairy & Eggs": "🥛", "Meat": "🥩", "Seafood": "🐟",
  "Pantry": "🫙", "Canned Goods": "🥫", "Snacks": "🍫", "Frozen": "🧊",
  "Beverages": "🧃", "Bakery": "🍞", "Deli": "🥪", "Bulk": "🌾",
