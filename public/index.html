// ── Persistent state hook ─────────────────────────────────────────────────────
function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      return stored !== null ? JSON.parse(stored) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

// ── Reclassify Modal (Copilot-inspired) ──────────────────────────────────────
function ReclassifyModal({ item, onClose, onSave, customCats }) {
  const [selectedL1, setSelectedL1] = useState(item.l1);
  const [selectedL2, setSelectedL2] = useState(item.l2);
  const [scope, setScope] = useState("once"); // "once" | "all" | "rule"
  const [search, setSearch] = useState("");

  const l1Options = [...Object.keys(WF_CATEGORIES), ...customCats.map(c => c.name)];
  const l2Options = WF_CATEGORIES[selectedL1]?.sub || customCats.find(c => c.name === selectedL1)?.sub || [];
  const filteredL1 = l1Options.filter(l => l.toLowerCase().includes(search.toLowerCase()));

  const wfCat = WF_CATEGORIES[selectedL1];
  const color = wfCat?.color || COLORS.purple;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 24, maxWidth: 500, width: "100%", maxHeight: "85vh", overflow: "auto", boxShadow: `0 0 60px rgba(0,0,0,0.5)` }}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div>
            <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Reclassify Item</div>
            <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 15 }}>{item.name}</div>
            <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>Currently: <span style={{ color }}>{item.l1}{item.l2 ? " › " + item.l2 : ""}</span></div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 20, lineHeight: 1 }}>✕</button>
        </div>

        {/* Search */}
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search categories…"
          style={{ width: "100%", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none", marginBottom: 14 }} />

        {/* L1 Grid */}
        <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Department (Level 1)</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
          {filteredL1.map(l1 => {
            const c = WF_CATEGORIES[l1];
            const col = c?.color || COLORS.purple;
            const active = selectedL1 === l1;
            return (
              <button key={l1} onClick={() => { setSelectedL1(l1); setSelectedL2(""); }}
                style={{ padding: "6px 12px", borderRadius: 8, cursor: "pointer", border: `1px solid ${active ? col : COLORS.border}`, background: active ? col + "22" : COLORS.surfaceAlt, color: active ? col : COLORS.muted, fontFamily: "inherit", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 5, transition: "all 0.12s" }}>
                {c?.icon || "📁"} {l1}
              </button>
            );
          })}
        </div>

        {/* L2 List */}
        {selectedL1 && l2Options.length > 0 && (
          <>
            <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Subcategory <span style={{fontWeight:400,textTransform:"none",letterSpacing:0}}>(optional)</span></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 18, background: COLORS.surfaceAlt, borderRadius: 10, overflow: "hidden", border: `1px solid ${COLORS.border}` }}>
              {l2Options.map(l2 => {
                const active = selectedL2 === l2;
                return (
                  <button key={l2} onClick={() => setSelectedL2(l2)}
                    style={{ padding: "9px 14px", background: active ? color + "22" : "transparent", border: "none", borderLeft: `3px solid ${active ? color : "transparent"}`, color: active ? color : COLORS.text, fontFamily: "inherit", fontSize: 13, textAlign: "left", cursor: "pointer", fontWeight: active ? 700 : 400, transition: "all 0.1s" }}>
                    {l2}
                  </button>
                );
              })}
            </div>
          </>
        )}

        {/* Scope — Copilot-style "apply to" */}
        <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>Apply this change to…</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 20 }}>
          {[
            { id: "once", label: "Just this item", desc: "Only reclassifies this one purchase" },
            { id: "all", label: "All matching items", desc: `Applies to all "${item.name}" across your receipts` },
            { id: "rule", label: "Create a rule (future + past)", desc: "Auto-classify this item name going forward and backfill history" },
          ].map(opt => (
            <div key={opt.id} onClick={() => setScope(opt.id)}
              style={{ display: "flex", gap: 10, padding: "10px 12px", borderRadius: 8, cursor: "pointer", border: `1px solid ${scope === opt.id ? COLORS.accent : COLORS.border}`, background: scope === opt.id ? COLORS.accentDim : COLORS.surfaceAlt, transition: "all 0.12s" }}>
              <div style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${scope === opt.id ? COLORS.accent : COLORS.border}`, background: scope === opt.id ? COLORS.accent : "transparent", flexShrink: 0, marginTop: 2 }} />
              <div>
                <div style={{ color: scope === opt.id ? COLORS.accent : COLORS.text, fontWeight: 600, fontSize: 13 }}>{opt.label}</div>
                <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 1 }}>{opt.desc}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Actions */}
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontWeight: 600, fontSize: 13 }}>Cancel</button>
          <button
            onClick={() => { onSave(item.id, selectedL1, selectedL2 || "", scope); onClose(); }}
            style={{ flex: 2, padding: "10px", background: selectedL1 ? COLORS.accentDim : COLORS.surfaceAlt, border: `1px solid ${selectedL1 ? COLORS.accent : COLORS.border}`, borderRadius: 8, color: selectedL1 ? COLORS.accent : COLORS.muted, cursor: selectedL1 ? "pointer" : "default", fontFamily: "inherit", fontWeight: 700, fontSize: 13 }}>
            Save Classification
          </button>
        </div>
      </div>
    </div>
  );
}

// ── AI Analysis Modal ────────────────────────────────────────────────────────
function AIModal({ item, onClose, dietary }) {
  const [loading, setLoading] = useState(true);
  const [alternatives, setAlternatives] = useState([]);
  const [error, setError] = useState(null);

  useEffect(() => {
    const restrictions = dietary.length > 0 ? `Dietary restrictions: ${dietary.join(", ")}.` : "";
    (async () => {
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST", headers: {
            "Content-Type": "application/json",
            "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514", max_tokens: 1000,
            messages: [{ role: "user", content:
`Shopper bought "${item.name}" for ${fmt(item.price)} (${item.l1}). ${restrictions}
Suggest 2 cheaper alternatives that maintain nutritional value and meet dietary restrictions.
Return ONLY a JSON array, no markdown:
[{
  "name": "product name",
  "brand": "brand name",
  "store": "store name",
  "price": 0.00,
  "savings": 0.00,
  "savingsPct": 0,
  "reason": "one sentence — why this is a good swap",
  "nutritionNote": "one sentence — how nutrition compares"
}]`
            }]
          })
        });
        const data = await res.json();
        const text = data.content?.[0]?.text || "[]";
        const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
        setAlternatives(parsed);
      } catch (e) {
        setError("Could not load suggestions. Try again.");
      }
      setLoading(false);
    })();
  }, []);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center", padding: "0" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: "20px 20px 0 0", padding: "24px 20px 36px", width: "100%", maxWidth: 560, maxHeight: "85vh", overflow: "auto", boxShadow: "0 -8px 40px rgba(0,0,0,0.5)" }}>

        {/* Handle bar */}
        <div style={{ width: 36, height: 4, background: COLORS.border, borderRadius: 4, margin: "0 auto 20px" }} />

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
          <div style={{ flex: 1, minWidth: 0, marginRight: 12 }}>
            <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>Cheaper Alternatives</div>
            <div style={{ color: COLORS.text, fontSize: 17, fontWeight: 800, lineHeight: 1.3 }}>{item.name}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
              <span style={{ color: COLORS.danger, fontWeight: 700, fontSize: 15 }}>{fmt(item.price)}</span>
              <span style={{ color: COLORS.muted, fontSize: 12 }}>· {item.l1}</span>
            </div>
          </div>
          <button onClick={onClose} style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.muted, cursor: "pointer", fontSize: 14, borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>✕</button>
        </div>

        {/* Dietary filters */}
        {dietary.length > 0 && (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
            <span style={{ color: COLORS.muted, fontSize: 11, alignSelf: "center" }}>Filtered for:</span>
            {dietary.map(d => <Tag key={d} color={COLORS.blue}>{d}</Tag>)}
          </div>
        )}

        {/* Loading */}
        {loading && (
          <div style={{ textAlign: "center", padding: "32px 0" }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>⚡</div>
            <div style={{ color: COLORS.text, fontWeight: 600, fontSize: 14, marginBottom: 4 }}>Finding alternatives…</div>
            <div style={{ color: COLORS.muted, fontSize: 12 }}>Checking prices at nearby stores</div>
          </div>
        )}

        {/* Error */}
        {!loading && error && (
          <div style={{ background: COLORS.danger + "18", border: `1px solid ${COLORS.danger}44`, borderRadius: 10, padding: "14px 16px", color: COLORS.danger, fontSize: 13 }}>
            {error}
          </div>
        )}

        {/* Alternative cards */}
        {!loading && !error && alternatives.map((alt, i) => (
          <div key={i} style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: "16px", marginBottom: 12 }}>
            {/* Top row */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
              <div style={{ flex: 1, minWidth: 0, marginRight: 10 }}>
                <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 14, lineHeight: 1.3 }}>{alt.name}</div>
                {alt.brand && <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>{alt.brand}</div>}
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ color: COLORS.accent, fontWeight: 800, fontSize: 18 }}>{fmt(alt.price)}</div>
                <div style={{ color: COLORS.accent, fontSize: 11, fontWeight: 600 }}>save {fmt(alt.savings)} ({alt.savingsPct}%)</div>
              </div>
            </div>

            {/* Store pill */}
            <div style={{ display: "inline-flex", alignItems: "center", gap: 5, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 20, padding: "3px 10px", marginBottom: 10 }}>
              <span style={{ fontSize: 12 }}>🏪</span>
              <span style={{ color: COLORS.blue, fontSize: 12, fontWeight: 600 }}>{alt.store}</span>
            </div>

            {/* Reason */}
            <div style={{ color: COLORS.text, fontSize: 13, lineHeight: 1.6, marginBottom: alt.nutritionNote ? 8 : 0 }}>
              {alt.reason}
            </div>

            {/* Nutrition note */}
            {alt.nutritionNote && (
              <div style={{ display: "flex", gap: 6, alignItems: "flex-start", marginTop: 8, background: COLORS.surface, borderRadius: 8, padding: "8px 10px" }}>
                <span style={{ fontSize: 13, flexShrink: 0 }}>🥗</span>
                <span style={{ color: COLORS.muted, fontSize: 12, lineHeight: 1.5 }}>{alt.nutritionNote}</span>
              </div>
            )}
          </div>
        ))}

        {!loading && !error && alternatives.length === 0 && (
          <div style={{ textAlign: "center", padding: "24px 0", color: COLORS.muted, fontSize: 13 }}>
            No alternatives found for this item.
          </div>
        )}
      </div>
    </div>
  );
}

// ── Custom Category Manager ──────────────────────────────────────────────────
function CustomCatManager({ customCats, setCustomCats }) {
  const [newCat, setNewCat] = useState("");
  const [newSub, setNewSub] = useState("");
  const [expandedCat, setExpandedCat] = useState(null);
  const add = () => { if (newCat.trim()) { setCustomCats(p => [...p, { name: newCat.trim(), sub: [], color: COLORS.purple }]); setNewCat(""); } };
  const addSub = (catName) => { if (newSub.trim()) { setCustomCats(p => p.map(c => c.name === catName ? { ...c, sub: [...c.sub, newSub.trim()] } : c)); setNewSub(""); } };
  const removeCat = (name) => setCustomCats(p => p.filter(c => c.name !== name));
  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} placeholder="New custom department…"
          style={{ flex: 1, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
        <button onClick={add} style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13 }}>+ Add</button>
      </div>
      {customCats.length === 0 && <div style={{ color: COLORS.muted, fontSize: 13 }}>No custom categories yet.</div>}
      {customCats.map(cat => (
        <div key={cat.name} style={{ background: COLORS.surfaceAlt, borderRadius: 10, border: `1px solid ${COLORS.border}`, marginBottom: 8, overflow: "hidden" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", cursor: "pointer" }} onClick={() => setExpandedCat(expandedCat === cat.name ? null : cat.name)}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span>📁</span>
              <span style={{ color: COLORS.purple, fontWeight: 700, fontSize: 13 }}>{cat.name}</span>
              <span style={{ color: COLORS.muted, fontSize: 11 }}>{cat.sub.length} subcategories</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span style={{ color: COLORS.muted, fontSize: 12 }}>{expandedCat === cat.name ? "▲" : "▼"}</span>
              <button onClick={e => { e.stopPropagation(); removeCat(cat.name); }} style={{ background: "none", border: "none", color: COLORS.danger, cursor: "pointer", fontSize: 14, padding: "0 2px" }}>✕</button>
            </div>
          </div>
          {expandedCat === cat.name && (
            <div style={{ borderTop: `1px solid ${COLORS.border}`, padding: "10px 14px" }}>
              {cat.sub.map((s, i) => <div key={i} style={{ color: COLORS.text, fontSize: 13, padding: "3px 0", paddingLeft: 16, borderLeft: `2px solid ${COLORS.purple}` }}>{s}</div>)}
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <input value={newSub} onChange={e => setNewSub(e.target.value)} onKeyDown={e => e.key === "Enter" && addSub(cat.name)} placeholder="Add subcategory…"
                  style={{ flex: 1, background: COLORS.bg, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "6px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 12, outline: "none" }} />
                <button onClick={() => addSub(cat.name)} style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, borderRadius: 6, padding: "6px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>+ Sub</button>

// ── Receipt Manager ──────────────────────────────────────────────────────────
function ReceiptManager({ receipts, setReceipts, onClose }) {
  const [expanded, setExpanded] = useState(null);
  const [editingItem, setEditingItem] = useState(null); // { receiptId, itemIdx }
  const [editValues, setEditValues] = useState({});

  const deleteReceipt = (id) => {
    setReceipts(prev => prev.filter(r => r.id !== id));
    if (expanded === id) setExpanded(null);
  };

  const deleteItem = (receiptId, itemIdx) => {
    setReceipts(prev => prev.map(r =>
      r.id === receiptId ? { ...r, items: r.items.filter((_, i) => i !== itemIdx) } : r
    ));
  };

  const startEdit = (receiptId, itemIdx, item) => {
    setEditingItem({ receiptId, itemIdx });
    setEditValues({ name: item.name, price: item.price, qty: item.qty || 1 });
  };

  const saveEdit = () => {
    if (!editingItem) return;
    setReceipts(prev => prev.map(r =>
      r.id === editingItem.receiptId ? {
        ...r,
        items: r.items.map((item, i) =>
          i === editingItem.itemIdx
            ? { ...item, name: editValues.name, price: parseFloat(editValues.price) || 0, qty: parseInt(editValues.qty) || 1 }
            : item
        )
      } : r
    ));
    setEditingItem(null);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 600, maxHeight: "90vh", overflow: "auto", boxShadow: "0 -8px 40px rgba(0,0,0,0.5)" }}>

        {/* Handle + header */}
        <div style={{ position: "sticky", top: 0, background: COLORS.surface, borderBottom: `1px solid ${COLORS.border}`, padding: "16px 20px 14px", zIndex: 10 }}>
          <div style={{ width: 36, height: 4, background: COLORS.border, borderRadius: 4, margin: "0 auto 14px" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ color: COLORS.text, fontWeight: 800, fontSize: 17 }}>Receipt History</div>
              <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>{receipts.length} receipt{receipts.length !== 1 ? "s" : ""}</div>
            </div>
            <button onClick={onClose} style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, color: COLORS.muted, cursor: "pointer", borderRadius: 8, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>✕</button>
          </div>
        </div>

        <div style={{ padding: "12px 20px 40px" }}>
          {receipts.length === 0 && (
            <div style={{ textAlign: "center", padding: "40px 0", color: COLORS.muted, fontSize: 13 }}>No receipts yet</div>
          )}

          {receipts.map(r => {
            const isOpen = expanded === r.id;
            const dateStr = r.date || new Date(r.scannedAt).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
            const icon = r.type === "online" ? "📱" : "🏪";
            const subCount = r.items?.filter(i => i.substituted).length || 0;

            return (
              <div key={r.id} style={{ marginBottom: 10, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 14, overflow: "hidden" }}>

                {/* Receipt row */}
                <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", cursor: "pointer" }}
                  onClick={() => setExpanded(isOpen ? null : r.id)}>
                  <span style={{ fontSize: 20, flexShrink: 0 }}>{icon}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 14 }}>{r.store || r.service || "Unknown"}</div>
                    <div style={{ display: "flex", gap: 8, marginTop: 2, alignItems: "center", flexWrap: "wrap" }}>
                      <span style={{ color: COLORS.muted, fontSize: 12 }}>{dateStr}</span>
                      {r.items?.length > 0 && <span style={{ color: COLORS.muted, fontSize: 12 }}>{r.items.length} items</span>}
                      {subCount > 0 && <Tag color={COLORS.warn}>{subCount} sub</Tag>}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                    <span style={{ color: COLORS.accent, fontWeight: 800, fontSize: 15 }}>{fmt(r.total || 0)}</span>
                    <span style={{ color: COLORS.muted, fontSize: 11 }}>{isOpen ? "▲" : "▼"}</span>
                  </div>
                </div>

                {/* Expanded items */}
                {isOpen && (
                  <div style={{ borderTop: `1px solid ${COLORS.border}`, padding: "12px 16px 16px" }}>

                    {/* Delete receipt */}
                    <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
                      <button onClick={() => deleteReceipt(r.id)}
                        style={{ background: COLORS.danger + "18", border: `1px solid ${COLORS.danger}44`, color: COLORS.danger, borderRadius: 8, padding: "5px 12px", cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
                        🗑 Delete receipt
                      </button>
                    </div>

                    {/* Items */}
                    {(r.items || []).map((item, idx) => {
                      const isEditing = editingItem?.receiptId === r.id && editingItem?.itemIdx === idx;
                      return (
                        <div key={idx} style={{ padding: "8px 0", borderBottom: `1px solid ${COLORS.border}22` }}>
                          {isEditing ? (
                            <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                              <input value={editValues.name} onChange={e => setEditValues(p => ({ ...p, name: e.target.value }))}
                                style={{ flex: 1, minWidth: 120, background: COLORS.surface, border: `1px solid ${COLORS.accent}`, borderRadius: 6, padding: "5px 8px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
                              <input value={editValues.qty} type="number" min="1"
                                onChange={e => setEditValues(p => ({ ...p, qty: e.target.value }))}
                                style={{ width: 44, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "5px 6px", color: COLORS.muted, fontFamily: "inherit", fontSize: 12, outline: "none", textAlign: "center" }} />
                              <input value={editValues.price} type="number" step="0.01"
                                onChange={e => setEditValues(p => ({ ...p, price: e.target.value }))}
                                style={{ width: 64, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "5px 6px", color: COLORS.accent, fontFamily: "inherit", fontSize: 12, outline: "none", textAlign: "right" }} />
                              <button onClick={saveEdit}
                                style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, borderRadius: 6, padding: "5px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 700 }}>✓</button>
                              <button onClick={() => setEditingItem(null)}
                                style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "5px 8px", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>✕</button>
                            </div>
                          ) : (
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <span style={{ color: COLORS.text, fontSize: 13 }}>{item.qty > 1 ? `${item.qty}× ` : ""}{item.name}</span>
                              </div>
                              <span style={{ color: COLORS.text, fontWeight: 600, fontSize: 13, flexShrink: 0 }}>{fmt(item.price)}</span>
                              <button onClick={() => startEdit(r.id, idx, item)}
                                style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, flexShrink: 0 }}>✏️</button>
                              <button onClick={() => deleteItem(r.id, idx)}
                                style={{ background: "none", border: "none", color: COLORS.danger, cursor: "pointer", fontSize: 15, padding: "0 2px", flexShrink: 0, lineHeight: 1 }}>×</button>
                            </div>
                          )}
                        </div>
                      );
                    })}

                    {(r.items || []).length === 0 && (
                      <div style={{ color: COLORS.muted, fontSize: 12, textAlign: "center", padding: "12px 0" }}>No items in this receipt</div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ScanTab({ receipts, setReceipts }) {
  const [mode, setMode] = useState(null);
  const [onlineService, setOnlineService] = useState(null);
  const [pasteText, setPasteText] = useState("");
  const [processing, setProcessing] = useState(false);
  const [processingMsg, setProcessingMsg] = useState("");
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [showSubstitutions, setShowSubstitutions] = useState(true);
  const [subActions, setSubActions] = useState({});
  const [showAllItems, setShowAllItems] = useState(false);
  const [editingItems, setEditingItems] = useState(false);
  const [editedItems, setEditedItems] = useState([]);
  const fileInputRef = useRef(null);
  const [showManager, setShowManager] = useState(false);

  const resetToStart = () => {
    setMode(null); setOnlineService(null); setPasteText("");
    setResult(null); setProcessing(false); setError(null); setProcessingMsg("");
    setShowAllItems(false);
    setEditingItems(false);
    setEditedItems([]);
  };

  // ── Helpers ────────────────────────────────────────────────────────────────
  const fileToBase64 = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(",")[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });

  const saveReceipt = (parsed) => {
    const receipt = {
      id: Date.now(),
      scannedAt: new Date().toISOString(),
      ...parsed,
    };
    setReceipts(prev => [receipt, ...prev]);
    return receipt;
  };

  // ── In-store OCR ───────────────────────────────────────────────────────────
  const processInStore = async (file) => {
    if (!file) return;
    setProcessing(true);
    setError(null);
    setProcessingMsg("Reading receipt image…");

    try {
      const mediaType = file.type || "image/jpeg";
      const isPdf = mediaType === "application/pdf";

      let messageContent;
      if (isPdf) {
        setProcessingMsg("Extracting text from PDF…");
        const base64 = await fileToBase64(file);
        messageContent = [
          { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } },
          { type: "text", text: `Extract all items from this grocery receipt. Return ONLY valid JSON, no markdown fences.

Important rules for item names:
- Convert ALL abbreviated/shorthand names to plain readable English
- Remove size/weight from name (put in qty field instead)
- Capitalize properly
- If the same item appears multiple times, combine into one entry and sum the prices

{"store":"store name or Unknown","date":"date string or today","total":0.00,"subtotal":0.00,"tax":0.00,"items":[{"name":"clean readable item name","qty":1,"price":0.00,"category":"Produce|Dairy & Eggs|Meat|Seafood|Pantry|Canned Goods|Snacks|Frozen|Beverages|Bakery|Deli|Bulk|Household|Personal Care|Other"}]}` }
        ];
      } else {
        setProcessingMsg("Scanning receipt with AI…");
        const base64 = await fileToBase64(file);
        messageContent = [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: `Extract all line items from this grocery receipt. Return ONLY valid JSON, no markdown fences.

Important rules for item names:
- Convert ALL abbreviated/shorthand names to plain readable English (e.g. "ORGMC CHKN BST 2LB" → "Organic Chicken Breast", "GF MULTIGR BRD" → "Gluten-Free Multigrain Bread")
- Remove size/weight from name (put in qty field instead)
- Capitalize properly
- If the same item appears multiple times, combine into one entry and sum the prices

{"store":"store name or Unknown","date":"date string or today","total":0.00,"subtotal":0.00,"tax":0.00,"items":[{"name":"clean readable item name","qty":1,"price":0.00,"category":"Produce|Dairy & Eggs|Meat|Seafood|Pantry|Canned Goods|Snacks|Frozen|Beverages|Bakery|Deli|Bulk|Household|Personal Care|Other"}]}` }
        ];
      }

      setProcessingMsg("AI extracting items…");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: {
          "Content-Type": "application/json",
          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 2000,
          messages: [{ role: "user", content: messageContent }]
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error("API " + res.status + ": " + (errData?.error?.message || res.statusText));
      }
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text || "{}";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      if (!parsed.items) throw new Error("Could not parse receipt items — try a clearer photo");

      const receipt = saveReceipt({ type: "instore", ...parsed, fileName: file.name });
      setResult({ type: "instore", ...parsed, id: receipt.id });
      setEditedItems(parsed.items || []);
    } catch (e) {
      setError((e.message || "Failed to read receipt") + ". If this persists, check your API key in Vercel.");
    }
    setProcessing(false);
    setProcessingMsg("");
  };

  // ── Online order parser ────────────────────────────────────────────────────
  const processOnline = async () => {
    if (!pasteText.trim()) return;
    setProcessing(true);
    setError(null);

    try {

          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 2500,
          messages: [{ role: "user", content:
`Parse this online grocery order confirmation. Extract every detail carefully, especially any shopper substitutions.
Return ONLY valid JSON, no markdown fences:
{
  "service": "${onlineService?.label || "Online"}",

  "date": "order date",
  "total": 0.00,
  "subtotal": 0.00,
  "deliveryFee": 0.00,
  "serviceFee": 0.00,
  "tip": 0.00,
  "items": [
    {
      "name": "item name",
      "qty": 1,
      "price": 0.00,
      "priceEach": 0.00,
      "substituted": false,
      "substitutedFor": "original item name if this is a sub",
      "substitutedNote": "note about the substitution if any"
    }
  ]
}

Order text:
${pasteText.slice(0, 8000)}`
          }]
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text || "{}";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      if (!parsed.items) throw new Error("Could not find items in this order");

      const fees = (parsed.deliveryFee || 0) + (parsed.serviceFee || 0) + (parsed.tip || 0);
      const premiumPct = parsed.subtotal > 0 ? Math.round((fees / parsed.subtotal) * 100) : 0;
      const enriched = {
        ...parsed,
        hiddenCosts: {
          deliveryFee: parsed.deliveryFee || 0,
          serviceFee: parsed.serviceFee || 0,
          tip: parsed.tip || 0,
          effectivePremium: fees,
          effectivePremiumPct: premiumPct,
        }
      };

      const receipt = saveReceipt({ type: "online", ...enriched });
      setResult({ type: "online", ...enriched, id: receipt.id });
    } catch (e) {
      setError(e.message || "Could not parse this order. Try pasting more of the email.");
    }
    setProcessing(false);
    setProcessingMsg("");
  };

  const substitutions = result?.items?.filter(i => i.substituted) || [];
  const RECEIPT_TYPE_ICON = { instore: "🏪", online: "📱" };

  // ── Entry point: pick mode ─────────────────────────────────────────────────
  if (!mode) return (
    <div style={{ maxWidth: 600, margin: "0 auto" }}>
      <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Add Purchase</h2>
      <p style={{ color: COLORS.muted, fontSize: 14, marginBottom: 28 }}>How did you shop this time?</p>

      <div style={{ display: "flex", gap: 14, marginBottom: 32 }}>
        <div onClick={() => setMode("instore")}
          style={{ flex: 1, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: "28px 20px", textAlign: "center", cursor: "pointer", transition: "all 0.15s" }}
          onMouseEnter={e => { e.currentTarget.style.border = `1px solid ${COLORS.accent}`; e.currentTarget.style.background = COLORS.accentDim; }}
          onMouseLeave={e => { e.currentTarget.style.border = `1px solid ${COLORS.border}`; e.currentTarget.style.background = COLORS.surface; }}>
          <div style={{ fontSize: 38, marginBottom: 12 }}>🏪</div>
          <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 15, marginBottom: 6 }}>In-Store</div>
          <div style={{ color: COLORS.muted, fontSize: 12, lineHeight: 1.5 }}>Scan or upload a paper receipt — JPG, PNG, or PDF</div>
        </div>
        <div onClick={() => setMode("online")}
          style={{ flex: 1, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: "28px 20px", textAlign: "center", cursor: "pointer", transition: "all 0.15s" }}
          onMouseEnter={e => { e.currentTarget.style.border = `1px solid ${COLORS.blue}`; e.currentTarget.style.background = COLORS.blueDim; }}
          onMouseLeave={e => { e.currentTarget.style.border = `1px solid ${COLORS.border}`; e.currentTarget.style.background = COLORS.surface; }}>
          <div style={{ fontSize: 38, marginBottom: 12 }}>📱</div>
          <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 15, marginBottom: 6 }}>Online Order</div>
          <div style={{ color: COLORS.muted, fontSize: 12, lineHeight: 1.5 }}>Amazon Fresh, Instacart, Thrive, and more</div>
        </div>
      </div>

      {showManager && <ReceiptManager receipts={receipts} setReceipts={setReceipts} onClose={() => setShowManager(false)} />}

      {/* Real receipt history */}
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ color: COLORS.muted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.07em" }}>
            Recent Purchases {receipts.length === 0 && <span style={{ color: COLORS.border }}>— none yet</span>}
          </div>
          {receipts.length > 0 && (
            <button onClick={() => setShowManager(true)}
              style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 600 }}>
              Manage →
            </button>
          )}
        </div>
        {receipts.length === 0 && (
          <div style={{ textAlign: "center", padding: "32px 0", color: COLORS.muted, fontSize: 13 }}>
            📭 Scan your first receipt to get started
          </div>
        )}
        {receipts.slice(0, 8).map(r => {
          const subCount = r.items?.filter(i => i.substituted).length || 0;
          const icon = r.type === "online" ? "📱" : "🏪";
          const dateStr = r.date || new Date(r.scannedAt).toLocaleDateString("en-US", { month: "short", day: "numeric" });
          return (
            <Card key={r.id} style={{ marginBottom: 8, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 18 }}>{icon}</span>
                <div>
                  <div style={{ color: COLORS.text, fontWeight: 600, fontSize: 13 }}>{r.store || r.service || "Unknown store"}</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 2, alignItems: "center" }}>
                    <span style={{ color: COLORS.muted, fontSize: 11 }}>{dateStr}</span>
                    {r.items?.length > 0 && <span style={{ color: COLORS.muted, fontSize: 11 }}>{r.items.length} items</span>}
                    {r.type === "online" && <Tag color={COLORS.blue}>online</Tag>}
                    {subCount > 0 && <Tag color={COLORS.warn}>{subCount} sub</Tag>}
                  </div>
                </div>
              </div>
              <div style={{ color: COLORS.accent, fontWeight: 800, fontSize: 15 }}>{fmt(r.total || 0)}</div>
            </Card>
          );
        })}
      </div>
    </div>
  );

  // ── In-store flow ──────────────────────────────────────────────────────────
  if (mode === "instore") return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
        <button onClick={resetToStart} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 13, fontFamily: "inherit", padding: 0 }}>← Back</button>
        <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800 }}>Scan In-Store Receipt</h2>
      </div>

      {/* Hidden file input */}
      <input ref={fileInputRef} type="file" accept="image/*,.pdf" style={{ display: "none" }}
        onChange={e => { const f = e.target.files?.[0]; if (f) processInStore(f); e.target.value = ""; }} />

      {!processing && !result && (
        <>
          <div
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={e => {
              e.preventDefault(); setDragging(false);
              const f = e.dataTransfer.files?.[0];
              if (f) processInStore(f);
            }}
            onClick={() => fileInputRef.current?.click()}
            style={{ border: `2px dashed ${dragging ? COLORS.accent : COLORS.border}`, borderRadius: 16, padding: "56px 40px", textAlign: "center", cursor: "pointer", transition: "all 0.2s", background: dragging ? COLORS.accentDim : COLORS.surfaceAlt }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>📷</div>
            <div style={{ color: COLORS.text, fontWeight: 700, fontSize: 15 }}>Drop receipt image here</div>
            <div style={{ color: COLORS.muted, fontSize: 13, marginTop: 6 }}>or click to browse · JPG, PNG, PDF</div>
          </div>
          {error && (
            <div style={{ marginTop: 14, background: COLORS.danger + "18", border: `1px solid ${COLORS.danger}44`, borderRadius: 10, padding: "12px 16px", color: COLORS.danger, fontSize: 13 }}>
              ⚠️ {error}
            </div>
          )}
        </>
      )}

      {processing && (
        <Card style={{ textAlign: "center", padding: "48px 40px" }}>
          <div style={{ fontSize: 36, marginBottom: 14 }}>⚙️</div>
          <div style={{ color: COLORS.text, fontWeight: 700, marginBottom: 6 }}>{processingMsg}</div>
          <div style={{ color: COLORS.muted, fontSize: 13 }}>This takes about 5–10 seconds</div>
          <div style={{ marginTop: 20, height: 4, background: COLORS.border, borderRadius: 4, overflow: "hidden" }}>
            <div style={{ height: "100%", width: "65%", background: COLORS.accent, borderRadius: 4, animation: "none" }} />
          </div>
        </Card>
      )}

      {result && !processing && (
        <Card style={{ border: `1px solid ${COLORS.accent}` }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 16 }}>
            <span style={{ fontSize: 26 }}>✅</span>
            <div>
              <div style={{ color: COLORS.accent, fontWeight: 800, fontSize: 15, marginBottom: 2 }}>Receipt added!</div>
              <div style={{ color: COLORS.text, fontSize: 14, fontWeight: 600 }}>{result.store} · {result.date}</div>
              <div style={{ color: COLORS.muted, fontSize: 13 }}>{result.items?.length || 0} items · {fmt(result.total)}</div>
            </div>
          </div>
          {/* Item preview / editor */}
          {result.items?.length > 0 && (
            <div style={{ background: COLORS.surfaceAlt, borderRadius: 8, padding: "10px 14px", marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.07em" }}>
                  {editingItems ? "Edit Items" : "Items extracted"}
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <div style={{ color: COLORS.muted, fontSize: 11 }}>{(editingItems ? editedItems : result.items).length} items</div>
                  <button onClick={() => {
                    if (!editingItems) setEditedItems(result.items.map(i => ({ ...i })));
                    else {
                      // Save edits back to receipts
                      setReceipts(prev => prev.map(r => r.id === result.id ? { ...r, items: editedItems } : r));
                      setResult(prev => ({ ...prev, items: editedItems }));
                    }
                    setEditingItems(e => !e);
                    setShowAllItems(true);
                  }}
                    style={{ background: editingItems ? COLORS.accentDim : "none", border: `1px solid ${editingItems ? COLORS.accent : COLORS.border}`, borderRadius: 6, color: editingItems ? COLORS.accent : COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, padding: "3px 10px", fontWeight: editingItems ? 700 : 400 }}>
                    {editingItems ? "✓ Save" : "✏️ Edit"}
                  </button>
                  {editingItems && (
                    <button onClick={() => { setEditingItems(false); setEditedItems([]); }}
                      style={{ background: "none", border: `1px solid ${COLORS.border}`, borderRadius: 6, color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, padding: "3px 8px" }}>
                      Cancel
                    </button>
                  )}
                </div>
              </div>

              {/* View mode */}
              {!editingItems && (
                <>
                  {(showAllItems ? result.items : result.items.slice(0, 5)).map((item, i, arr) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: i < arr.length - 1 ? `1px solid ${COLORS.border}22` : "none" }}>
                      <span style={{ color: COLORS.text, fontSize: 12 }}>{item.qty > 1 ? `${item.qty}× ` : ""}{item.name}</span>
                      <span style={{ color: COLORS.muted, fontSize: 12, flexShrink: 0, marginLeft: 8 }}>{fmt(item.price)}</span>
                    </div>
                  ))}
                  {result.items.length > 5 && (
                    <button onClick={() => setShowAllItems(s => !s)}
                      style={{ marginTop: 8, background: "none", border: `1px solid ${COLORS.border}`, borderRadius: 6, color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, padding: "5px 12px", width: "100%" }}>
                      {showAllItems ? "▲ Show less" : `▼ Show all ${result.items.length} items`}
                    </button>
                  )}
                </>
              )}

              {/* Edit mode */}
              {editingItems && (
                <>
                  {editedItems.map((item, i) => (
                    <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${COLORS.border}22` }}>
                      <input value={item.name} onChange={e => setEditedItems(prev => prev.map((it, idx) => idx === i ? { ...it, name: e.target.value } : it))}
                        style={{ flex: 1, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "4px 8px", color: COLORS.text, fontFamily: "inherit", fontSize: 12, outline: "none", minWidth: 0 }} />
                      <input value={item.qty || 1} type="number" min="1"
                        onChange={e => setEditedItems(prev => prev.map((it, idx) => idx === i ? { ...it, qty: Number(e.target.value) } : it))}
                        style={{ width: 40, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "4px 6px", color: COLORS.muted, fontFamily: "inherit", fontSize: 12, outline: "none", textAlign: "center" }} />
                      <input value={item.price} type="number" step="0.01" min="0"
                        onChange={e => setEditedItems(prev => prev.map((it, idx) => idx === i ? { ...it, price: parseFloat(e.target.value) || 0 } : it))}
                        style={{ width: 60, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 6, padding: "4px 6px", color: COLORS.accent, fontFamily: "inherit", fontSize: 12, outline: "none", textAlign: "right" }} />
                      <button onClick={() => setEditedItems(prev => prev.filter((_, idx) => idx !== i))}
                        style={{ background: "none", border: "none", color: COLORS.danger, cursor: "pointer", fontSize: 14, padding: "0 2px", lineHeight: 1, flexShrink: 0 }}>×</button>
                    </div>
                  ))}
                  {/* Add item row */}
                  <button onClick={() => setEditedItems(prev => [...prev, { name: "", qty: 1, price: 0.00, category: "Other" }])}
                    style={{ marginTop: 8, background: "none", border: `1px dashed ${COLORS.border}`, borderRadius: 6, color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, padding: "5px 12px", width: "100%" }}>
                    + Add item
                  </button>
                </>
              )}
            </div>
          )}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={resetToStart}
              style={{ flex: 1, padding: "9px", background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, borderRadius: 8, color: COLORS.accent, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13 }}>
              + Add Another
            </button>
          </div>
        </Card>
      )}
    </div>
  );

  // ── Online flow — service picker ───────────────────────────────────────────
  if (mode === "online" && !onlineService) return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
        <button onClick={resetToStart} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 13, fontFamily: "inherit", padding: 0 }}>← Back</button>
        <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800 }}>Online Order</h2>
      </div>
      <p style={{ color: COLORS.muted, fontSize: 13, marginBottom: 20 }}>Which service did you order from?</p>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
        {ONLINE_SERVICES.map(s => (
          <div key={s.id} onClick={() => setOnlineService(s)}
            style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px", borderRadius: 10, border: `1px solid ${COLORS.border}`, background: COLORS.surface, cursor: "pointer", transition: "all 0.15s" }}
            onMouseEnter={e => { e.currentTarget.style.border = `1px solid ${s.color}`; e.currentTarget.style.background = s.color + "15"; }}
            onMouseLeave={e => { e.currentTarget.style.border = `1px solid ${COLORS.border}`; e.currentTarget.style.background = COLORS.surface; }}>
            <span style={{ fontSize: 22 }}>{s.icon}</span>
            <span style={{ color: COLORS.text, fontWeight: 600, fontSize: 14 }}>{s.label}</span>
          </div>
        ))}
      </div>
    </div>
  );

  // ── Online flow — paste input ──────────────────────────────────────────────
  if (mode === "online" && onlineService && !processing && !result) return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
        <button onClick={() => setOnlineService(null)} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 13, fontFamily: "inherit", padding: 0 }}>← Back</button>
        <span style={{ fontSize: 22 }}>{onlineService.icon}</span>
        <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800 }}>{onlineService.label}</h2>
      </div>

      <div style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "12px 16px", marginBottom: 16, display: "flex", gap: 8 }}>
        <span style={{ color: COLORS.blue, fontSize: 14 }}>💡</span>
        <span style={{ color: COLORS.muted, fontSize: 12, lineHeight: 1.6 }}>{onlineService.hint}. Paste the full email including itemized list for best results.</span>
      </div>

      <textarea
        value={pasteText} onChange={e => setPasteText(e.target.value)}
        placeholder={`Paste your ${onlineService.label} order confirmation email here…`}
        style={{ width: "100%", minHeight: 200, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "12px 16px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, resize: "vertical", outline: "none", lineHeight: 1.6 }}
      />

      {error && (
        <div style={{ marginTop: 10, background: COLORS.danger + "18", border: `1px solid ${COLORS.danger}44`, borderRadius: 10, padding: "10px 14px", color: COLORS.danger, fontSize: 13 }}>
          ⚠️ {error}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <button onClick={() => { setOnlineService(null); setError(null); }}
          style={{ padding: "10px 18px", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 13 }}>
          ← Change
        </button>
        <button onClick={processOnline} disabled={!pasteText.trim()}
          style={{ flex: 1, padding: "10px", borderRadius: 8, cursor: pasteText.trim() ? "pointer" : "default", border: `1px solid ${pasteText.trim() ? COLORS.blue : COLORS.border}`, background: pasteText.trim() ? COLORS.blueDim : COLORS.surfaceAlt, color: pasteText.trim() ? COLORS.blue : COLORS.muted, fontFamily: "inherit", fontSize: 13, fontWeight: 700 }}>
          Parse Order →
        </button>
      </div>
    </div>
  );

  if (processing) return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <Card style={{ textAlign: "center", padding: "48px 40px" }}>
        <div style={{ fontSize: 36, marginBottom: 14 }}>{onlineService?.icon || "⚙️"}</div>
        <div style={{ color: COLORS.text, fontWeight: 700, marginBottom: 6 }}>{processingMsg}</div>
        <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 20 }}>Extracting items, fees, and checking for substitutions</div>
        <div style={{ height: 4, background: COLORS.border, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: "70%", background: COLORS.blue, borderRadius: 4 }} />
        </div>
      </Card>
    </div>
  );

  // ── Result: online order ───────────────────────────────────────────────────
  if (result?.type === "online") return (
    <div style={{ maxWidth: 620, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        <button onClick={resetToStart} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontSize: 13, fontFamily: "inherit", padding: 0 }}>← Add another</button>
        <span style={{ color: COLORS.accent, fontWeight: 700, fontSize: 13 }}>✅ Saved</span>
      </div>

      <Card style={{ marginBottom: 14, border: `1px solid ${COLORS.blue}44` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
          <div>
            <div style={{ color: COLORS.text, fontWeight: 800, fontSize: 16 }}>{result.store || result.service}</div>
            <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>{result.date} · {result.items?.length || 0} items</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: COLORS.text, fontWeight: 800, fontSize: 20 }}>{fmt(result.total)}</div>
            <div style={{ color: COLORS.muted, fontSize: 11 }}>total paid</div>
          </div>
        </div>

        {result.subtotal > 0 && (
          <div style={{ background: COLORS.surfaceAlt, borderRadius: 8, padding: "10px 14px", marginBottom: 12 }}>
            <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.07em", marginBottom: 8 }}>Cost Breakdown</div>
            {[
              { label: "Groceries", val: result.subtotal },
              { label: "Delivery fee", val: result.deliveryFee },
              { label: "Service fee", val: result.serviceFee },
              { label: "Tip", val: result.tip },
            ].filter(r => r.val > 0).map(row => (
              <div key={row.label} style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ color: COLORS.muted, fontSize: 12 }}>{row.label}</span>
                <span style={{ color: COLORS.text, fontSize: 12 }}>{fmt(row.val)}</span>
              </div>
            ))}
            {result.hiddenCosts?.effectivePremium > 0 && (
              <div style={{ borderTop: `1px solid ${COLORS.border}`, marginTop: 6, paddingTop: 6, display: "flex", justifyContent: "space-between" }}>
                <span style={{ color: COLORS.warn, fontSize: 12, fontWeight: 700 }}>Online premium</span>
                <span style={{ color: COLORS.warn, fontSize: 12, fontWeight: 700 }}>+{fmt(result.hiddenCosts.effectivePremium)} (+{result.hiddenCosts.effectivePremiumPct}%)</span>
              </div>
            )}
          </div>
        )}

        {substitutions.length > 0 && (
          <div style={{ background: COLORS.warnDim, border: `1px solid ${COLORS.warn}44`, borderRadius: 8, padding: "10px 14px" }}>
            <div onClick={() => setShowSubstitutions(!showSubstitutions)}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ color: COLORS.warn, fontSize: 16 }}>⚠️</span>
                <div>
                  <div style={{ color: COLORS.warn, fontWeight: 700, fontSize: 13 }}>{substitutions.length} shopper substitution{substitutions.length > 1 ? "s" : ""}</div>
                  <div style={{ color: COLORS.muted, fontSize: 11 }}>Review and accept or flag for refund</div>
                </div>
              </div>
              <span style={{ color: COLORS.muted, fontSize: 11 }}>{showSubstitutions ? "▲" : "▼"}</span>
            </div>
            {showSubstitutions && (
              <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                {substitutions.map((item, i) => (
                  <div key={i} style={{ background: COLORS.surface, borderRadius: 7, padding: "10px 12px" }}>
                    <div style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: 8 }}>
                      <span style={{ color: COLORS.warn, fontSize: 12, paddingTop: 1 }}>→</span>

    </div>
  );

  return null;
}

// Maps OCR category strings to WF L1/L2 taxonomy
function mapCategoryToWF(category) {
  const c = (category || "").toLowerCase();
  // Produce — specific before generic
  if (c.includes("fruit") || c.includes("berry") || c.includes("apple") || c.includes("banana") || c.includes("citrus") || c.includes("melon") || c.includes("grape") || c.includes("mango") || c.includes("peach") || c.includes("pear") || c.includes("pineapple") || c.includes("cherry") || c.includes("plum") || c.includes("avocado")) return { l1: "Produce", l2: "Fresh Fruits" };

function filterByDateRange(receipts, dateRange, customFrom, customTo) {
  const now = new Date();
  return receipts.filter(r => {
    const d = new Date(r.scannedAt || r.date || now);
    if (isNaN(d)) return true;
    if (dateRange === "wtd") { const s = new Date(now); s.setDate(now.getDate() - now.getDay()); return d >= s; }
    if (dateRange === "mtd") { return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }
    if (dateRange === "weekly") { const s = new Date(now); s.setDate(now.getDate() - 7); return d >= s; }
    if (dateRange === "monthly") { const s = new Date(now); s.setMonth(now.getMonth() - 1); return d >= s; }
    if (dateRange === "quarterly") { const s = new Date(now); s.setMonth(now.getMonth() - 3); return d >= s; }
    if (dateRange === "yearly") { const s = new Date(now); s.setFullYear(now.getFullYear() - 1); return d >= s; }
    if (dateRange === "custom") { return d >= new Date(customFrom) && d <= new Date(customTo + "T23:59:59"); }
    return true;
  });
}

function AnalysisTab({ dietary, customCats, receipts = [] }) {
  const [reclassOverrides, setReclassOverrides] = useLocalStorage("gs_reclass", {});
  const [aiItem, setAiItem] = useState(null);
  const [reclassItem, setReclassItem] = useState(null);
  const [dateRange, setDateRange] = useState("monthly");
  const [customFrom, setCustomFrom] = useState(() => { const d = new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,10); });
  const [customTo, setCustomTo]   = useState(() => new Date().toISOString().slice(0,10));
  const [viewMode, setViewMode] = useState("l1");
  const [drillL1, setDrillL1] = useState(null);
  const [reclassToast, setReclassToast] = useState(null);

  // Derive flat item list from real receipts, filtered by date range
  const filteredReceipts = filterByDateRange(receipts, dateRange, customFrom, customTo);

  // Build flat item list from receipts
  const rawItems = filteredReceipts.flatMap(r =>
    (r.items || []).map((item, idx) => {
      const key = `${r.id}_${idx}`;
      const override = reclassOverrides[key] || reclassOverrides[`name_${item.name}`];
      // Map using item name first (more specific), fall back to category string
      const mappedFromName = mapCategoryToWF(item.name);
      const mappedFromCat  = mapCategoryToWF(item.category);
      const mapped = override || (mappedFromName.l2 !== "Canned & Jarred Goods" ? mappedFromName : mappedFromCat);
      return {
        id: key,
        name: item.name,
        qty: item.qty || 1,
        price: item.price || 0,
        l1: mapped.l1,
        l2: mapped.l2,
        store: r.store || r.service || "Unknown",
        date: r.date || new Date(r.scannedAt).toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        scannedAt: r.scannedAt,
        receiptId: r.id,
      };
    })
  );

  // Fuzzy dedup — normalize name, then group similar ones
  function normalizeName(name) {
    return name.toLowerCase()
      .replace(/\b(organic|365|kirkland|trader joe.s|whole foods|store brand)\b/g, "")
      .replace(/\b(boneless|skinless|grass.fed|free.range|cage.free|pasture.raised)\b/g, "")
      .replace(/\d+\s*(oz|lb|g|kg|ml|l|ct|pk|pack|count|piece)s?\b/gi, "")
      .replace(/[^a-z\s]/g, "")
      .replace(/\s+/g, " ").trim();
  }

  const dedupMap = {};
  rawItems.forEach(item => {
    const normalized = normalizeName(item.name);
    // Find existing key with similar normalized name
    const existingKey = Object.keys(dedupMap).find(k => {
      const kNorm = normalizeName(dedupMap[k].name);
      const similarity = normalized.split(" ").filter(w => w.length > 2 && kNorm.includes(w)).length;
      const maxWords = Math.max(normalized.split(" ").length, kNorm.split(" ").length);
      return maxWords > 0 && similarity / maxWords >= 0.6;
    });
    if (existingKey) {
      dedupMap[existingKey].qty += item.qty;
      dedupMap[existingKey].price += item.price;
      dedupMap[existingKey].count += 1;
    } else {
      dedupMap[normalized + "__" + item.store] = { ...item, count: 1 };
    }
  });
  const items = Object.values(dedupMap).sort((a, b) => b.price - a.price);

  const handleReclassify = (itemId, newL1, newL2, scope) => {
    const item = items.find(i => i.id === itemId);
    if (!item) return;
    setReclassOverrides(prev => {
      const next = { ...prev };
      if (scope === "once") { next[itemId] = { l1: newL1, l2: newL2 }; }
      else { next[`name_${item.name}`] = { l1: newL1, l2: newL2 }; }
      return next;
    });
    setReclassToast(`✓ Reclassified to ${newL1} › ${newL2}${scope !== "once" ? " (all matching)" : ""}`);
    setTimeout(() => setReclassToast(null), 3000);
    setReclassItem(null);
  };

  // Date range label
  const dateLabel = () => {
    if (!filteredReceipts.length) return "No receipts in range";
    const dates = filteredReceipts.map(r => new Date(r.scannedAt || Date.now())).filter(d => !isNaN(d)).sort((a,b) => a-b);
    if (!dates.length) return `${filteredReceipts.length} receipt${filteredReceipts.length !== 1 ? "s" : ""}`;
    const fmt2 = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    return dates.length === 1 ? fmt2(dates[0]) : `${fmt2(dates[0])} – ${fmt2(dates[dates.length-1])}`;
  };

  const totalSpend = items.reduce((a, i) => a + i.price, 0);
  const avgPerTrip = filteredReceipts.length > 0 ? totalSpend / filteredReceipts.length : 0;

  const l1Totals = {};
  items.forEach(i => { l1Totals[i.l1] = (l1Totals[i.l1] || 0) + i.price; });
  const sortedL1 = Object.entries(l1Totals).sort((a, b) => b[1] - a[1]);
  const maxAmt = Math.max(...sortedL1.map(([, v]) => v), 1);

  // Empty state
  if (receipts.length === 0) return (
    <div style={{ maxWidth: 600, textAlign: "center", padding: "60px 20px" }}>
      <div style={{ fontSize: 48, marginBottom: 16 }}>📊</div>
      <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800, marginBottom: 8 }}>No receipts yet</h2>
      <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.7 }}>
        Scan your first receipt in the Scan tab and your spending breakdown will appear here automatically.
      </p>
    </div>
  );

  // In-range empty state
  const noItemsInRange = receipts.length > 0 && items.length === 0;

  return (
    <div style={{ maxWidth: 800 }}>
      {aiItem && <AIModal item={aiItem} dietary={dietary} onClose={() => setAiItem(null)} />}
      {reclassItem && <ReclassifyModal item={reclassItem} onClose={() => setReclassItem(null)} onSave={handleReclassify} customCats={customCats} />}

      {reclassToast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, padding: "10px 20px", borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 300, whiteSpace: "nowrap" }}>
          {reclassToast}
        </div>
      )}

      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
        <div>
          <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Spending Analysis</h2>
          <p style={{ color: COLORS.muted, fontSize: 13 }}>{dateLabel()} · {items.length} items · {filteredReceipts.length} receipt{filteredReceipts.length !== 1 ? "s" : ""}</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <div style={{ position: "relative" }}>
            <select value={dateRange} onChange={e => setDateRange(e.target.value)}
              style={{ appearance: "none", WebkitAppearance: "none", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 32px 7px 12px", color: COLORS.accent, fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer", outline: "none", minWidth: 150 }}>
              {DATE_RANGES.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
            </select>
            <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", color: COLORS.muted, fontSize: 10, pointerEvents: "none" }}>▼</span>
          </div>
          {dateRange === "custom" && (
            <>
              <input type="date" value={customFrom} onChange={e => setCustomFrom(e.target.value)}
                style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 12, outline: "none" }} />
              <span style={{ color: COLORS.muted, fontSize: 12 }}>→</span>
              <input type="date" value={customTo} onChange={e => setCustomTo(e.target.value)}
                style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "7px 10px", color: COLORS.text, fontFamily: "inherit", fontSize: 12, outline: "none" }} />
            </>
          )}
        </div>
      </div>

      {/* Stat Cards */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
        <StatCard label="Total Spent" value={fmt(totalSpend)} sub={`${items.length} items`} />
        <StatCard label="Avg per Trip" value={filteredReceipts.length > 0 ? fmt(avgPerTrip) : "—"} sub={`${filteredReceipts.length} receipt${filteredReceipts.length !== 1 ? "s" : ""}`} />
        <StatCard label="Top Category" value={sortedL1[0] ? (WF_CATEGORIES[sortedL1[0][0]]?.icon + " " + sortedL1[0][0].split(" ")[0]) : "—"} sub={sortedL1[0] ? fmt(sortedL1[0][1]) : ""} color={WF_CATEGORIES[sortedL1[0]?.[0]]?.color || COLORS.warn} />
        <StatCard label="Receipts" value={String(receipts.length)} sub={`${filteredReceipts.length} in range`} color={COLORS.blue} />
      </div>

      {noItemsInRange ? (
        <Card style={{ textAlign: "center", padding: "40px 20px" }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>📅</div>
          <div style={{ color: COLORS.text, fontWeight: 700, marginBottom: 6 }}>No receipts in this date range</div>
          <div style={{ color: COLORS.muted, fontSize: 13 }}>Try a wider range or switch to "All Time"</div>
        </Card>
      ) : (
        <>
          {/* View Mode Toggle */}
          <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
            {[{ id: "l1", label: "By Department" }, { id: "items", label: "All Items" }].map(v => (
              <button key={v.id} onClick={() => { setViewMode(v.id); setDrillL1(null); }}
                style={{ padding: "6px 14px", borderRadius: 8, cursor: "pointer", border: `1px solid ${viewMode === v.id ? COLORS.blue : COLORS.border}`, background: viewMode === v.id ? COLORS.blueDim : COLORS.surfaceAlt, color: viewMode === v.id ? COLORS.blue : COLORS.muted, fontFamily: "inherit", fontSize: 12, fontWeight: 600, transition: "all 0.12s" }}>
                {v.label}
              </button>
            ))}
          </div>

          {/* Department view */}
          {viewMode === "l1" && (
            <Card style={{ marginBottom: 20 }}>
              <div style={{ fontWeight: 700, color: COLORS.text, marginBottom: 4, fontSize: 15 }}>Spend by Department</div>
              <div style={{ color: COLORS.muted, fontSize: 11, marginBottom: 16 }}>Click any row to expand subcategories</div>
              {sortedL1.map(([l1, amt]) => {
                const wf = WF_CATEGORIES[l1];
                const col = wf?.color || COLORS.purple;
                const isOpen = drillL1 === l1;
                const subsForL1 = items.filter(i => i.l1 === l1);
                const subTotals = {};
                subsForL1.forEach(i => { subTotals[i.l2] = (subTotals[i.l2] || 0) + i.price; });
                const sortedSubs = Object.entries(subTotals).sort((a, b) => b[1] - a[1]);
                const maxSub = Math.max(...sortedSubs.map(([, v]) => v), 1);
                return (
                  <div key={l1} style={{ marginBottom: isOpen ? 8 : 2 }}>
                    <div onClick={() => setDrillL1(isOpen ? null : l1)}
                      style={{ padding: "8px 10px", borderRadius: 8, cursor: "pointer", background: isOpen ? col + "14" : "transparent", border: `1px solid ${isOpen ? col + "55" : "transparent"}`, transition: "all 0.15s" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                        <span style={{ color: isOpen ? col : COLORS.text, fontSize: 13, fontWeight: isOpen ? 700 : 400, display: "flex", alignItems: "center", gap: 6 }}>
                          {wf?.icon || "📁"} {l1}
                        </span>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ color: col, fontSize: 13, fontWeight: 700 }}>{fmt(amt)}</span>
                          <span style={{ color: col, fontSize: 9, display: "inline-block", transition: "transform 0.2s", transform: isOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
                        </div>
                      </div>
                      <div style={{ height: 5, background: COLORS.border, borderRadius: 4 }}>
                        <div style={{ height: "100%", width: `${(amt / maxAmt) * 100}%`, background: isOpen ? col : col + "88", borderRadius: 4, transition: "all 0.2s" }} />
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{ marginLeft: 14, borderLeft: `2px solid ${col}55`, paddingLeft: 14, paddingTop: 8, paddingBottom: 4, marginBottom: 6 }}>
                        {sortedSubs.map(([l2, subAmt]) => (
                          <div key={l2} style={{ marginBottom: 9 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                              <span style={{ color: COLORS.muted, fontSize: 12 }}>{l2}</span>
                              <span style={{ color: col, fontSize: 12, fontWeight: 700 }}>{fmt(subAmt)}</span>
                            </div>
                            <div style={{ height: 4, background: COLORS.border, borderRadius: 3 }}>
                              <div style={{ height: "100%", width: `${(subAmt / maxSub) * 100}%`, background: col + "99", borderRadius: 3 }} />
                            </div>
                          </div>
                        ))}
                        <div style={{ borderTop: `1px solid ${COLORS.border}`, marginTop: 8, paddingTop: 8 }}>
                          {subsForL1.map(item => (
                            <div key={item.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${COLORS.border}22` }}>
                              <div>
                                <div style={{ color: COLORS.text, fontSize: 12 }}>{item.name}{item.count > 1 ? " ×" + item.count : ""}</div>
                                <div style={{ color: COLORS.muted, fontSize: 10 }}>{item.l2} · {item.store}{item.count > 1 ? " · bought " + item.count + "x" : " · " + item.date}</div>
                              </div>
                              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                <span style={{ color: COLORS.text, fontWeight: 700, fontSize: 12 }}>{fmt(item.price)}</span>
                                <button onClick={e => { e.stopPropagation(); setReclassItem(item); }}
                                  style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 5, padding: "2px 6px", cursor: "pointer", fontFamily: "inherit", fontSize: 10 }}>✏️</button>
                                <button onClick={e => { e.stopPropagation(); setAiItem(item); }}
                                  style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}44`, color: COLORS.accent, borderRadius: 5, padding: "2px 6px", cursor: "pointer", fontFamily: "inherit", fontSize: 10, fontWeight: 700 }}>⚡</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </Card>
          )}

          {/* All Items view */}
          {viewMode === "items" && (
            <>
              <div style={{ color: COLORS.muted, fontSize: 12, marginBottom: 10 }}>Click ✏️ to reclassify · ⚡ for AI savings analysis</div>
              {items.map(item => {
                const wf = WF_CATEGORIES[item.l1];
                const col = wf?.color || COLORS.purple;
                return (
                  <Card key={item.id} style={{ marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                      <div style={{ flex: 1, minWidth: 160 }}>
                        <div style={{ color: COLORS.text, fontSize: 13, fontWeight: 600 }}>{item.name}</div>
                        <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 2 }}>{item.store} · {item.date}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <button onClick={() => setReclassItem(item)}
                          style={{ background: col + "18", border: `1px solid ${col}44`, color: col, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                          {wf?.icon || "📁"} {item.l2} <span style={{ opacity: 0.6, fontSize: 10 }}>✏️</span>
                        </button>
                        <span style={{ color: COLORS.text, fontWeight: 700, fontSize: 14, minWidth: 52, textAlign: "right" }}>{fmt(item.price)}</span>
                        <button onClick={() => setAiItem(item)}
                          style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}44`, color: COLORS.accent, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 700 }}>
                          ⚡ AI
                        </button>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </>
          )}
        </>
      )}
    </div>
  );
}
