// ── Simple line-by-line list input ────────────────────────────────────────────
function SimpleListInput({ items, onAdd, onRemove }) {
  const [val, setVal] = useState("");
  const inputRef = useRef(null);

  const commit = () => {
    const lines = val.split(/\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    lines.forEach(line => onAdd(line));
    setVal("");
  };

  const handleKeyDown = (e) => {
    // Enter on single-line input submits; shift+enter allows newlines in textarea
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      commit();
    }
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
        <div style={{ flex: 1, position: "relative" }}>
          <textarea
            ref={inputRef}
            value={val}
            onChange={e => setVal(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder={"1 can of chickpeas\n2 lbs chicken breast organic\noat milk\nsalmon fillet\n…"}
            rows={4}
            style={{
              width: "100%", background: COLORS.surfaceAlt,
              border: `1px solid ${COLORS.border}`, borderRadius: 10,
              padding: "12px 14px", color: COLORS.text, fontFamily: "inherit",
              fontSize: 14, lineHeight: 1.9, outline: "none", resize: "none",
              boxSizing: "border-box",
            }}
          />
          <div style={{ position: "absolute", bottom: 10, right: 12, color: COLORS.muted, fontSize: 10 }}>
            Enter to add · Shift+Enter for new line
          </div>
        </div>
        <button onClick={commit} disabled={!val.trim()}
          style={{
            background: val.trim() ? COLORS.accentDim : COLORS.surfaceAlt,
            border: `1px solid ${val.trim() ? COLORS.accent : COLORS.border}`,
            color: val.trim() ? COLORS.accent : COLORS.muted,
            borderRadius: 10, padding: "12px 18px", cursor: val.trim() ? "pointer" : "default",
            fontFamily: "inherit", fontSize: 13, fontWeight: 700, flexShrink: 0,
          }}>
          Add
        </button>
      </div>

      {/* Added items list */}
      {items.length > 0 && (
        <div style={{ marginTop: 14 }}>
          {items.map((item, i) => (
            <div key={item.id} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "8px 0",
              borderBottom: `1px solid ${COLORS.border}22`,
            }}>
              {/* Category icon */}
              <span style={{ fontSize: 16, flexShrink: 0, width: 22, textAlign: "center" }}>
                {item.categorizing ? "⏳" : (CATEGORY_ICONS[item.category] || "🛒")}
              </span>

              {/* Item info */}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: COLORS.text, fontSize: 13, fontWeight: 500 }}>
                  {item.raw}
                </div>
                {item.category && !item.categorizing && (
                  <div style={{ display: "flex", gap: 6, marginTop: 2, flexWrap: "wrap" }}>
                    <span style={{ color: COLORS.muted, fontSize: 11 }}>{item.category}</span>
                    {item.qty && <span style={{ color: COLORS.blue, fontSize: 11 }}>{item.qty}</span>}
                    {item.notes && <span style={{ color: COLORS.muted, fontSize: 11, fontStyle: "italic" }}>{item.notes}</span>}
                  </div>
                )}
                {item.categorizing && (
                  <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 2 }}>categorizing…</div>
                )}
              </div>

              <button onClick={() => onRemove(item.id)}
                style={{ background: "none", border: "none", color: COLORS.border, cursor: "pointer", fontSize: 15, lineHeight: 1, flexShrink: 0 }}>
                ×
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Shopping List Tab ─────────────────────────────────────────────────────────
function ShoppingListTab({ shoppingList, setShoppingList, savingsProfile, dietary, userProfile }) {
  const [phase, setPhase] = useState("trip");   // trip → input → optimized → final
  const [tripMode, setTripMode] = useState(null); // "one" | "two" | "any"
  const [listItems, setListItems] = useState([]);
  const [optimizing, setOptimizing] = useState(false);
  const [optimizedItems, setOptimizedItems] = useState([]);
  const [accepted, setAccepted] = useState({});
  const [groupBy, setGroupBy] = useState("store"); // "store" | "category"

  const TRIP_MODES = [
    {
      id: "one",
      icon: "⚡",
      label: "One store only",
      desc: "I have ~30 min. Get everything from the most convenient single store.",
      color: COLORS.blue,
    },
    {
      id: "two",
      icon: "🗺️",
      label: "Two stores max",
      desc: "I can make two stops. Balance savings vs. convenience.",
      color: COLORS.accent,
    },
    {
      id: "any",
      icon: "🏆",
      label: "Best value wins",
      desc: "I have time to shop around. Optimize fully across all my stores.",
      color: COLORS.warn,
    },
  ];

  // Categorize a single item via AI
  const categorizeItem = async (item) => {
    try {
      const organicHint = userProfile?.organicOnly
        ? " User always buys organic — if no organic qualifier mentioned, assume organic."
        : "";
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: {
          "Content-Type": "application/json",
          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 120,
          messages: [{ role: "user", content:
`Parse this grocery item into structured fields. Return ONLY JSON, no markdown:${organicHint}
Item: "${item.raw}"
{"category":"Produce|Dairy & Eggs|Meat|Seafood|Pantry|Canned Goods|Snacks|Frozen|Beverages|Bakery|Deli|Bulk|Household|Personal Care|Other","qty":"e.g. 1 can, 2 lbs, 3 — or null","notes":"e.g. organic, free-range — or null"}`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.[0]?.text || "{}";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setListItems(prev => prev.map(i =>
        i.id === item.id ? { ...i, ...parsed, categorizing: false } : i
      ));
    } catch {
      setListItems(prev => prev.map(i =>
        i.id === item.id ? { ...i, category: "Other", categorizing: false } : i
      ));
    }
  };

  const addItems = (raw) => {
    const lines = raw.split(/\n/).map(l => l.trim()).filter(Boolean);
    const newItems = lines.map(line => ({
      id: Date.now() + Math.random(), raw: line,
      category: null, qty: null, notes: null, categorizing: true,
    }));
    setListItems(prev => [...prev, ...newItems]);
    newItems.forEach(item => categorizeItem(item));
  };

  const removeListItem = (id) => setListItems(prev => prev.filter(i => i.id !== id));

  const optimize = async () => {
    if (!listItems.length) return;
    setOptimizing(true);

    const profileExtra = userProfile
      ? [
          userProfile.organicOnly && "prefers organic",
          userProfile.localPreferred && "prefers local/seasonal",
          userProfile.budget && `price sensitivity: ${userProfile.budget}`,
          userProfile.avoid?.length && `never buys: ${userProfile.avoid.join(", ")}`,
        ].filter(Boolean).join(", ")
      : "";

    const tripConstraint = {
      one: "IMPORTANT: Assign ALL items to a SINGLE store. Pick the one store that covers the most items best.",
      two: "IMPORTANT: Assign items to AT MOST TWO stores total. Group smartly — minimize trips while maximizing savings.",
      any: "Assign each item to the best store for that item. Multiple stores are fine.",
    }[tripMode];

    const knownStores = savingsProfile?.stores?.length
      ? `User's preferred stores: ${savingsProfile.stores.join(", ")}.`
      : "";

    const profile = savingsProfile
      ? `location: ${savingsProfile.location}, DIY: ${savingsProfile.diyWillingness}${profileExtra ? ", " + profileExtra : ""}`
      : profileExtra || "no profile";

    const dietStr = dietary.length > 0 ? `Dietary restrictions: ${dietary.join(", ")}.` : "";
    const listStr = listItems.map((c, i) => `${i + 1}. ${c.raw}`).join("\n");

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: {
          "Content-Type": "application/json",
          "x-api-key": process.env.REACT_APP_ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 2000,
          messages: [{ role: "user", content:
`You are a grocery shopping optimizer. For each item, assign the best store to buy it and suggest a cheaper swap if one exists — respecting the trip constraint strictly.

${tripConstraint}
${knownStores}
Profile: ${profile}
${dietStr}

Shopping list:
${listStr}

Return ONLY a JSON array, one object per item, no markdown:
[{
  "original": "item as written",
  "swap": "cheaper alternative or same as original",
  "hasSwap": true or false,
  "store": "store name — required for every item",
  "savings": 0.00,
  "price": 0.00,
  "reason": "one sentence why this store and/or swap, or empty"
}]`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.[0]?.text || "[]";
      const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
      setOptimizedItems(parsed.map((item, i) => ({ ...item, id: i })));
      setAccepted({});
      setPhase("optimized");
    } catch {
      setOptimizedItems(listItems.map((c, i) => ({
        id: i, original: c.raw, swap: c.raw,
        hasSwap: false, store: "Whole Foods", savings: 0, price: 0, reason: ""
      })));
      setPhase("optimized");
    }
    setOptimizing(false);
  };

  const buildFinalList = () => {
    const items = optimizedItems.map((item, i) => {
      const useSwap = item.hasSwap && accepted[i] !== false;
      return {
        id: Date.now() + i,
        name: useSwap ? item.swap : item.original,
        store: item.store || "Any",
        savings: useSwap ? (item.savings || 0) : 0,
        price: item.price || 0,
        category: listItems[i]?.category || "Other",
        replaces: useSwap ? item.original : null,
        checked: false, optimized: useSwap,
      };
    });
    setShoppingList(items);
    setPhase("final");
  };

  const swapCount = optimizedItems.filter(i => i.hasSwap).length;
  const acceptedSavings = optimizedItems
    .filter((item, i) => item.hasSwap && accepted[i] !== false)
    .reduce((a, i) => a + (i.savings || 0), 0);
  const totalSavingsIfAll = optimizedItems.filter(i => i.hasSwap).reduce((a, i) => a + (i.savings || 0), 0);
  const stillCategorizing = listItems.some(i => i.categorizing);

  // ── TRIP MODE PICKER ──────────────────────────────────────────────────────
  if (phase === "trip") return (
    <div style={{ maxWidth: 520 }}>
      <div style={{ marginBottom: 28 }}>
        <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Shopping List</h2>
        <p style={{ color: COLORS.muted, fontSize: 14 }}>How much time do you have today?</p>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 28 }}>
        {TRIP_MODES.map(mode => (
          <div key={mode.id} onClick={() => setTripMode(mode.id)}
            style={{
              display: "flex", alignItems: "center", gap: 16, padding: "16px 18px",
              borderRadius: 12, cursor: "pointer", transition: "all 0.15s",
              border: `1px solid ${tripMode === mode.id ? mode.color : COLORS.border}`,
              background: tripMode === mode.id ? mode.color + "15" : COLORS.surfaceAlt,
            }}>
            <span style={{ fontSize: 28, flexShrink: 0 }}>{mode.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ color: tripMode === mode.id ? mode.color : COLORS.text, fontWeight: 700, fontSize: 14 }}>
                {mode.label}
              </div>
              <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2, lineHeight: 1.5 }}>{mode.desc}</div>
            </div>
            <div style={{
              width: 18, height: 18, borderRadius: "50%", flexShrink: 0,
              border: `2px solid ${tripMode === mode.id ? mode.color : COLORS.border}`,
              background: tripMode === mode.id ? mode.color : "transparent",
              transition: "all 0.15s",
            }} />
          </div>
        ))}
      </div>

      <button onClick={() => setPhase("input")} disabled={!tripMode}
        style={{
          width: "100%", padding: "13px", borderRadius: 10,
          cursor: tripMode ? "pointer" : "default",
          border: `1px solid ${tripMode ? COLORS.accent : COLORS.border}`,
          background: tripMode ? COLORS.accentDim : COLORS.surfaceAlt,
          color: tripMode ? COLORS.accent : COLORS.muted,
          fontFamily: "inherit", fontSize: 14, fontWeight: 700,
        }}>
        {tripMode ? `Continue with "${TRIP_MODES.find(m => m.id === tripMode)?.label}" →` : "Pick a trip type to continue"}
      </button>
    </div>
  );

  // ── INPUT PHASE ───────────────────────────────────────────────────────────
  if (phase === "input") return (
    <div style={{ maxWidth: 580 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
        <button onClick={() => setPhase("trip")}
          style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 13, padding: 0 }}>← Back</button>
        <div>
          <h2 style={{ color: COLORS.text, fontSize: 20, fontWeight: 800 }}>What do you need?</h2>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
            <span style={{ fontSize: 14 }}>{TRIP_MODES.find(m => m.id === tripMode)?.icon}</span>
            <span style={{ color: COLORS.muted, fontSize: 12 }}>{TRIP_MODES.find(m => m.id === tripMode)?.label}</span>
            <button onClick={() => setPhase("trip")}
              style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, textDecoration: "underline", padding: 0 }}>
              change
            </button>
          </div>
        </div>
      </div>

      <p style={{ color: COLORS.muted, fontSize: 13, marginBottom: 14, lineHeight: 1.6 }}>
        Type naturally — "2 lbs chicken breast", "1 can chickpeas", "oat milk". We'll categorize and find the best store for each.
      </p>

      <SimpleListInput items={listItems} onAdd={addItems} onRemove={removeListItem} />

      {listItems.length > 0 && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ color: COLORS.muted, fontSize: 12 }}>{listItems.length} item{listItems.length > 1 ? "s" : ""}</span>
            {stillCategorizing && <span style={{ color: COLORS.muted, fontSize: 11 }}>⏳ categorizing…</span>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setListItems([])}
              style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 7, padding: "8px 14px", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>
              Clear
            </button>
            <button onClick={optimize} disabled={optimizing || stillCategorizing}
              style={{
                background: (!optimizing && !stillCategorizing) ? COLORS.accentDim : COLORS.surfaceAlt,
                border: `1px solid ${(!optimizing && !stillCategorizing) ? COLORS.accent : COLORS.border}`,
                color: (!optimizing && !stillCategorizing) ? COLORS.accent : COLORS.muted,
                borderRadius: 7, padding: "8px 20px",
                cursor: (!optimizing && !stillCategorizing) ? "pointer" : "default",
                fontFamily: "inherit", fontSize: 13, fontWeight: 700,
                display: "flex", alignItems: "center", gap: 8,
              }}>
              {optimizing ? <>⚙️ Optimizing…</> : stillCategorizing ? <>⏳ Categorizing…</> : <>⚡ Optimize →</>}
            </button>
          </div>
        </div>
      )}
    </div>
  );

  // ── OPTIMIZED PHASE (review) ──────────────────────────────────────────────
  if (phase === "optimized") {
    // group by store for the review header
    const storeSet = [...new Set(optimizedItems.map(i => i.store).filter(Boolean))];

    return (
      <div style={{ maxWidth: 660 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
          <div>
            <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Review Plan</h2>
            <p style={{ color: COLORS.muted, fontSize: 13 }}>
              {storeSet.length} store{storeSet.length > 1 ? "s" : ""}: {storeSet.join(" + ")}
              {swapCount > 0 && ` · ${swapCount} swap${swapCount > 1 ? "s" : ""} suggested`}
            </p>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: COLORS.accent, fontSize: 22, fontWeight: 800 }}>{fmt(acceptedSavings)}</div>
            <div style={{ color: COLORS.muted, fontSize: 11 }}>savings selected</div>
          </div>
        </div>

        {swapCount > 0 && (
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <button onClick={() => { const a = {}; optimizedItems.forEach((_, i) => { a[i] = true; }); setAccepted(a); }}
              style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}44`, color: COLORS.accent, borderRadius: 7, padding: "6px 14px", cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 600 }}>
              ✓ Accept all swaps ({fmt(totalSavingsIfAll)})
            </button>
            <button onClick={() => { const a = {}; optimizedItems.forEach((_, i) => { a[i] = false; }); setAccepted(a); }}
              style={{ background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 7, padding: "6px 14px", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>
              ✕ Keep originals
            </button>
          </div>
        )}

        {/* Group review by store */}
        {storeSet.map(store => {
          const storeItems = optimizedItems.map((item, i) => ({ ...item, idx: i })).filter(item => item.store === store);
          const storeIcon = STORE_ICON_MAP[store] || "🏪";
          return (
            <Card key={store} style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, paddingBottom: 10, borderBottom: `1px solid ${COLORS.border}` }}>
                <span style={{ fontSize: 18 }}>{storeIcon}</span>
                <span style={{ color: COLORS.text, fontWeight: 700, fontSize: 14 }}>{store}</span>
                <span style={{ color: COLORS.muted, fontSize: 12 }}>· {storeItems.length} item{storeItems.length > 1 ? "s" : ""}</span>
              </div>
              {storeItems.map((item) => {
                const i = item.idx;
                const useSwap = item.hasSwap && accepted[i] !== false;
                const rejected = item.hasSwap && accepted[i] === false;
                const catIcon = CATEGORY_ICONS[listItems[i]?.category] || "🛒";
                return (
                  <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "9px 0", borderBottom: `1px solid ${COLORS.border}18` }}>
                    <span style={{ fontSize: 14, paddingTop: 1, flexShrink: 0 }}>{catIcon}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ color: item.hasSwap && !rejected ? COLORS.muted : COLORS.text, fontSize: 13, textDecoration: item.hasSwap && !rejected ? "line-through" : "none" }}>
                        {item.original}
                      </div>
                    </div>
                    {item.hasSwap ? (
                      <>
                        <div style={{ color: useSwap ? COLORS.accent : COLORS.border, fontSize: 13, flexShrink: 0, paddingTop: 1 }}>→</div>
                        <div style={{ flex: 1.1, minWidth: 0 }}>
                          <div style={{ color: useSwap ? COLORS.accent : COLORS.muted, fontSize: 13, fontWeight: useSwap ? 700 : 400 }}>{item.swap}</div>
                          {item.savings > 0 && <div style={{ color: COLORS.accent, fontSize: 11, fontWeight: 700 }}>-{fmt(item.savings)}</div>}
                          {item.reason && <div style={{ color: COLORS.muted, fontSize: 11 }}>{item.reason}</div>}
                        </div>
                        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                          <button onClick={() => setAccepted(p => ({ ...p, [i]: true }))}
                            style={{ width: 26, height: 26, borderRadius: 6, cursor: "pointer", border: `1px solid ${useSwap ? COLORS.accent : COLORS.border}`, background: useSwap ? COLORS.accentDim : "transparent", color: useSwap ? COLORS.accent : COLORS.muted, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}>✓</button>
                          <button onClick={() => setAccepted(p => ({ ...p, [i]: false }))}
                            style={{ width: 26, height: 26, borderRadius: 6, cursor: "pointer", border: `1px solid ${rejected ? COLORS.danger : COLORS.border}`, background: rejected ? COLORS.danger + "22" : "transparent", color: rejected ? COLORS.danger : COLORS.muted, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
                        </div>
                      </>
                    ) : (
                      <div style={{ color: COLORS.muted, fontSize: 11, paddingTop: 2, flexShrink: 0 }}>✓</div>
                    )}
                  </div>
                );
              })}
            </Card>
          );
        })}

        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={() => setPhase("input")}
            style={{ padding: "10px 18px", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 13 }}>
            ← Edit list
          </button>
          <button onClick={buildFinalList}
            style={{ flex: 1, padding: "11px", borderRadius: 8, cursor: "pointer", border: `1px solid ${COLORS.accent}`, background: COLORS.accentDim, color: COLORS.accent, fontFamily: "inherit", fontSize: 14, fontWeight: 700 }}>
            Build Shopping Plan →
          </button>
        </div>
      </div>
    );
  }

  // ── FINAL PHASE ───────────────────────────────────────────────────────────
  const toggleChecked = (id) => setShoppingList(p => p.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
  const removeFinal   = (id) => setShoppingList(p => p.filter(i => i.id !== id));
  const clearChecked  = ()   => setShoppingList(p => p.filter(i => !i.checked));

  const byStore = {};
  const byCategory = {};
  shoppingList.forEach(item => {
    const s = item.store || "Any";
    if (!byStore[s]) byStore[s] = [];
    byStore[s].push(item);
    const c = item.category || "Other";
    if (!byCategory[c]) byCategory[c] = [];
    byCategory[c].push(item);
  });

  const groupedData = groupBy === "store" ? byStore : byCategory;
  const totalSavings = shoppingList.reduce((a, i) => a + (i.savings || 0), 0);
  const checkedCount = shoppingList.filter(i => i.checked).length;
  const optimizedCount = shoppingList.filter(i => i.optimized).length;
  const storeCount = Object.keys(byStore).length;

  return (
    <div style={{ maxWidth: 580 }}>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
        <div>
          <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 4 }}>Shopping Plan</h2>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ color: COLORS.muted, fontSize: 12 }}>
              {shoppingList.length} items · {storeCount} store{storeCount > 1 ? "s" : ""}
            </span>
            {optimizedCount > 0 && <Tag color={COLORS.accent}>{optimizedCount} swapped</Tag>}
            <Tag color={TRIP_MODES.find(m => m.id === tripMode)?.color || COLORS.muted}>
              {TRIP_MODES.find(m => m.id === tripMode)?.icon} {TRIP_MODES.find(m => m.id === tripMode)?.label}
            </Tag>
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
          {totalSavings > 0 && (
            <div style={{ textAlign: "right" }}>
              <div style={{ color: COLORS.accent, fontSize: 18, fontWeight: 800 }}>{fmt(totalSavings)}</div>
              <div style={{ color: COLORS.muted, fontSize: 10 }}>saved</div>
            </div>
          )}
          <button onClick={() => { setPhase("trip"); setShoppingList([]); setListItems([]); setTripMode(null); }}
            style={{ background: "none", border: `1px solid ${COLORS.border}`, color: COLORS.muted, borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontFamily: "inherit", fontSize: 11 }}>
            ✏️ New list
          </button>
        </div>
      </div>

      {/* Progress */}
      {checkedCount > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ color: COLORS.muted, fontSize: 12 }}>{checkedCount} of {shoppingList.length} checked off</span>
            <button onClick={clearChecked} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 11, textDecoration: "underline" }}>Clear checked</button>
          </div>
          <div style={{ height: 4, background: COLORS.border, borderRadius: 4 }}>
            <div style={{ height: "100%", width: `${(checkedCount / shoppingList.length) * 100}%`, background: COLORS.accent, borderRadius: 4, transition: "width 0.3s" }} />
          </div>
        </div>
      )}

      {/* Group by toggle */}
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[{ id: "store", label: "🏪 By store" }, { id: "category", label: "🥦 By category" }].map(opt => (
          <button key={opt.id} onClick={() => setGroupBy(opt.id)}
            style={{ padding: "5px 14px", borderRadius: 20, cursor: "pointer", fontFamily: "inherit", fontSize: 12, fontWeight: 600, transition: "all 0.15s",
              border: `1px solid ${groupBy === opt.id ? COLORS.accent : COLORS.border}`,
              background: groupBy === opt.id ? COLORS.accentDim : "transparent",
              color: groupBy === opt.id ? COLORS.accent : COLORS.muted,
            }}>
            {opt.label}
          </button>
        ))}
      </div>

      {/* Store route card — only when grouping by store */}
      {groupBy === "store" && storeCount > 1 && (
        <div style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ color: COLORS.muted, fontSize: 12 }}>Route:</span>
          {Object.keys(byStore).map((store, i) => (
            <React.Fragment key={store}>
              <span style={{ color: COLORS.text, fontSize: 12, fontWeight: 600 }}>
                {STORE_ICON_MAP[store] || "🏪"} {store}
                <span style={{ color: COLORS.muted, fontWeight: 400 }}> ({byStore[store].length})</span>
              </span>
              {i < Object.keys(byStore).length - 1 && <span style={{ color: COLORS.muted, fontSize: 12 }}>→</span>}
            </React.Fragment>
          ))}
        </div>
      )}

      {/* Grouped items */}
      {Object.entries(groupedData).map(([groupKey, items]) => {
        const icon = groupBy === "store" ? (STORE_ICON_MAP[groupKey] || "🏪") : (CATEGORY_ICONS[groupKey] || "🛒");
        const groupSavings = items.reduce((a, i) => a + (i.savings || 0), 0);
        const allChecked = items.every(i => i.checked);

        return (
          <div key={groupKey} style={{ marginBottom: 14 }}>
            {/* Group header */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 8px 6px", marginBottom: 2 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <span style={{ fontSize: 15 }}>{icon}</span>
                <span style={{ color: allChecked ? COLORS.muted : COLORS.text, fontSize: 13, fontWeight: 700 }}>
                  {groupKey}
                </span>
                {allChecked && <span style={{ color: COLORS.accent, fontSize: 11 }}>✓ done</span>}
              </div>
              {groupSavings > 0 && (
                <span style={{ color: COLORS.accent, fontSize: 12, fontWeight: 700 }}>-{fmt(groupSavings)}</span>
              )}
            </div>

            {/* Items */}
            {items.map(item => (
              <div key={item.id} style={{
                display: "flex", alignItems: "center", gap: 10, padding: "8px 10px",
                borderRadius: 8, marginBottom: 3,
                opacity: item.checked ? 0.35 : 1,
                background: item.checked ? "transparent" : COLORS.surfaceAlt + "99",
                transition: "opacity 0.2s",
              }}>
                {/* Checkbox */}
                <div onClick={() => toggleChecked(item.id)}
                  style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${item.checked ? COLORS.accent : COLORS.border}`, background: item.checked ? COLORS.accent : "transparent", flexShrink: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s" }}>
                  {item.checked && <span style={{ color: "#000", fontSize: 10, fontWeight: 900 }}>✓</span>}
                </div>

                {/* Name + meta */}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <span style={{ color: COLORS.text, fontSize: 13, textDecoration: item.checked ? "line-through" : "none" }}>
                      {item.name}
                    </span>
                    {item.optimized && <span style={{ background: COLORS.accentDim, color: COLORS.accent, fontSize: 9, fontWeight: 800, padding: "1px 5px", borderRadius: 4, letterSpacing: "0.04em" }}>SWAP</span>}
                    {/* Show store inline when grouped by category */}
                    {groupBy === "category" && (
                      <span style={{ color: COLORS.blue, fontSize: 11 }}>{STORE_ICON_MAP[item.store] || "🏪"} {item.store}</span>
                    )}
                  </div>
                  {item.replaces && (
                    <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 1 }}>replaces {item.replaces}</div>
                  )}
                </div>

                {/* Price + savings + remove */}
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                  {item.savings > 0 && <span style={{ color: COLORS.accent, fontSize: 11, fontWeight: 700 }}>-{fmt(item.savings)}</span>}
                  <button onClick={() => removeFinal(item.id)} style={{ background: "none", border: "none", color: COLORS.border, cursor: "pointer", fontSize: 13, lineHeight: 1 }}>×</button>
                </div>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}


// ── Preferences Tab ──────────────────────────────────────────────────────────
function PreferencesTab({ dietary, setDietary, dislikes, setDislikes, customCats, setCustomCats, userProfile }) {
  const [newDislike, setNewDislike] = useState("");
  const toggle = id => setDietary(p => p.includes(id) ? p.filter(d => d !== id) : [...p, id]);
  const addDislike = () => { if (newDislike.trim()) { setDislikes(p => [...p, newDislike.trim()]); setNewDislike(""); } };

  return (
    <div style={{ maxWidth: 640 }}>
      <h2 style={{ color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Preferences</h2>
      <p style={{ color: COLORS.muted, fontSize: 14, marginBottom: 20 }}>Your shopping profile — set during onboarding and editable anytime.</p>

      {/* Onboarding profile summary */}
      {userProfile && (
        <Card style={{ marginBottom: 20, background: COLORS.surfaceAlt }}>
          <div style={{ fontWeight: 700, color: COLORS.text, marginBottom: 12, fontSize: 14 }}>Your Shopping Profile</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {(userProfile.organicOnly || userProfile.localPreferred) && (
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <span style={{ color: COLORS.muted, fontSize: 12, minWidth: 80 }}>Quality</span>
                <div style={{ display: "flex", gap: 6 }}>
                  {userProfile.organicOnly && <Tag color={COLORS.accent}>🌿 Organic</Tag>}
                  {userProfile.localPreferred && <Tag color={COLORS.blue}>🏘️ Local</Tag>}
                </div>
              </div>
            )}
            {userProfile.budget && (
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <span style={{ color: COLORS.muted, fontSize: 12, minWidth: 80 }}>Budget</span>
                <span style={{ color: COLORS.text, fontSize: 13 }}>{{ budget: "💰 Budget first", balanced: "⚖️ Balanced", quality: "✨ Quality first" }[userProfile.budget]}</span>
              </div>
            )}
            {userProfile.avoid?.length > 0 && (
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <span style={{ color: COLORS.muted, fontSize: 12, minWidth: 80, paddingTop: 2 }}>Avoid</span>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                  {userProfile.avoid.map(a => <Tag key={a} color={COLORS.warn}>{a}</Tag>)}
                </div>
              </div>
            )}
          </div>
        </Card>
      )}

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 700, color: COLORS.text, marginBottom: 14, fontSize: 15 }}>Dietary Restrictions & Lifestyles</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          {DIETARY_OPTIONS.map(opt => {
            const active = dietary.includes(opt.id);
            return <button key={opt.id} onClick={() => toggle(opt.id)} style={{ padding: "8px 16px", borderRadius: 20, cursor: "pointer", border: `1px solid ${active ? COLORS.accent : COLORS.border}`, background: active ? COLORS.accentDim : COLORS.surfaceAlt, color: active ? COLORS.accent : COLORS.muted, fontFamily: "inherit", fontSize: 13, fontWeight: 600, transition: "all 0.15s" }}>{opt.icon} {opt.label}</button>;
          })}
        </div>
      </Card>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 700, color: COLORS.text, marginBottom: 6, fontSize: 15 }}>Ingredient Dislikes</div>
        <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 14 }}>Items we'll never suggest as substitutes.</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <input value={newDislike} onChange={e => setNewDislike(e.target.value)} onKeyDown={e => e.key === "Enter" && addDislike()} placeholder="e.g. cilantro, tofu, fish sauce…"
            style={{ flex: 1, background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 12px", color: COLORS.text, fontFamily: "inherit", fontSize: 13, outline: "none" }} />
          <button onClick={addDislike} style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13 }}>Add</button>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {dislikes.map((d, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 12px", background: COLORS.warnDim, border: `1px solid ${COLORS.warn}44`, borderRadius: 20, fontSize: 13, color: COLORS.warn }}>
              {d}<button onClick={() => setDislikes(p => p.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: COLORS.warn, cursor: "pointer", fontSize: 14, padding: 0, lineHeight: 1 }}>×</button>
            </div>
          ))}
          {dislikes.length === 0 && <span style={{ color: COLORS.muted, fontSize: 13 }}>None added yet</span>}
        </div>
      </Card>

      <Card>
        <div style={{ fontWeight: 700, color: COLORS.text, marginBottom: 6, fontSize: 15 }}>Custom Grocery Categories</div>
        <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 16 }}>Create your own departments and subcategories beyond Whole Foods' taxonomy.</div>
        <CustomCatManager customCats={customCats} setCustomCats={setCustomCats} />
      </Card>
    </div>
  );
}

// ── App Shell ────────────────────────────────────────────────────────────────
// ── Onboarding ────────────────────────────────────────────────────────────────
const ONBOARDING_STEPS = [
  { id: "welcome",   progress: 0 },
  { id: "dietary",   progress: 25 },
  { id: "quality",   progress: 50 },
  { id: "avoid",     progress: 75 },
  { id: "done",      progress: 100 },
];

function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [profile, setProfile] = useState({
    name: "",
    dietary: [],
    organicOnly: false,
    localPreferred: false,
    avoidInput: "",
    avoid: [],
    budget: "balanced", // "budget" | "balanced" | "quality"
  });

  const current = ONBOARDING_STEPS[step];
  const next = () => setStep(s => s + 1);
  const back = () => setStep(s => s - 1);
  const toggleDietary = (id) => setProfile(p => ({
    ...p, dietary: p.dietary.includes(id) ? p.dietary.filter(d => d !== id) : [...p.dietary, id]
  }));
  const addAvoid = () => {
    const val = profile.avoidInput.trim();
    if (val && !profile.avoid.includes(val)) {
      setProfile(p => ({ ...p, avoid: [...p.avoid, val], avoidInput: "" }));
    }
  };
  const removeAvoid = (item) => setProfile(p => ({ ...p, avoid: p.avoid.filter(a => a !== item) }));

  const finish = () => onComplete(profile);

  const inputStyle = {
    width: "100%", background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`,
    borderRadius: 10, padding: "12px 16px", color: COLORS.text,
    fontFamily: "inherit", fontSize: 15, outline: "none", boxSizing: "border-box",
  };

  const pillBtn = (active) => ({
    padding: "9px 18px", borderRadius: 20, cursor: "pointer", fontFamily: "inherit",
    fontSize: 13, fontWeight: active ? 700 : 400, transition: "all 0.15s",
    border: `1px solid ${active ? COLORS.accent : COLORS.border}`,
    background: active ? COLORS.accentDim : COLORS.surfaceAlt,
    color: active ? COLORS.accent : COLORS.text,
  });

  const nextBtn = (disabled = false, label = "Continue →") => (
    <button onClick={next} disabled={disabled}
      style={{
        width: "100%", padding: "13px", borderRadius: 10, cursor: disabled ? "default" : "pointer",
        border: `1px solid ${disabled ? COLORS.border : COLORS.accent}`,
        background: disabled ? COLORS.surfaceAlt : COLORS.accentDim,
        color: disabled ? COLORS.muted : COLORS.accent,
        fontFamily: "inherit", fontSize: 15, fontWeight: 700, transition: "all 0.15s",
      }}>
      {label}
    </button>
  );

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'DM Mono','Fira Code',monospace", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "24px" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700;800&display=swap'); * { box-sizing: border-box; margin: 0; padding: 0; }`}</style>

      <div style={{ width: "100%", maxWidth: 480 }}>

        {/* Logo */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 40, justifyContent: "center" }}>
          <div style={{ width: 36, height: 36, background: COLORS.accent, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>🛒</div>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 800, fontSize: 18, letterSpacing: "-0.02em", color: COLORS.text }}>GrocerySmart</div>
        </div>

        {/* Progress bar — hidden on welcome/done */}
        {step > 0 && step < ONBOARDING_STEPS.length - 1 && (
          <div style={{ marginBottom: 32 }}>
            <div style={{ height: 3, background: COLORS.border, borderRadius: 4 }}>
              <div style={{ height: "100%", width: `${current.progress}%`, background: COLORS.accent, borderRadius: 4, transition: "width 0.4s ease" }} />
            </div>
          </div>
        )}

        {/* ── STEP: Welcome ── */}
        {step === 0 && (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 52, marginBottom: 16 }}>👋</div>
            <h1 style={{ fontFamily: "'DM Sans',sans-serif", color: COLORS.text, fontSize: 26, fontWeight: 800, marginBottom: 10, lineHeight: 1.2 }}>
              Welcome to GrocerySmart
            </h1>
            <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.7, marginBottom: 32 }}>
              We'll ask a few quick questions so your shopping list, savings recommendations, and receipt analysis are personalized from day one.
            </p>
            <input
              value={profile.name}
              onChange={e => setProfile(p => ({ ...p, name: e.target.value }))}
              onKeyDown={e => e.key === "Enter" && profile.name.trim() && next()}
              placeholder="What should we call you?"
              style={{ ...inputStyle, textAlign: "center", fontSize: 16, marginBottom: 14 }}
              autoFocus
            />
            {nextBtn(!profile.name.trim(), profile.name.trim() ? `Let's go, ${profile.name.split(" ")[0]} →` : "Enter your name to continue")}
          </div>
        )}

        {/* ── STEP: Dietary ── */}
        {step === 1 && (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Any dietary restrictions?</h2>
              <p style={{ color: COLORS.muted, fontSize: 13 }}>We'll filter swaps and flag anything incompatible. Skip if none apply.</p>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 28 }}>
              {DIETARY_OPTIONS.map(opt => (
                <button key={opt.id} onClick={() => toggleDietary(opt.id)} style={pillBtn(profile.dietary.includes(opt.id))}>
                  {opt.icon} {opt.label}
                </button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={back} style={{ padding: "13px 20px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 14 }}>←</button>
              <div style={{ flex: 1 }}>{nextBtn(false, profile.dietary.length ? `Continue with ${profile.dietary.length} restriction${profile.dietary.length > 1 ? "s" : ""} →` : "Skip →")}</div>
            </div>
          </div>
        )}

        {/* ── STEP: Quality preferences ── */}
        {step === 2 && (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>How do you shop?</h2>
              <p style={{ color: COLORS.muted, fontSize: 13 }}>This shapes every recommendation — substitutes, list defaults, savings priorities.</p>
            </div>

            {/* Organic toggle */}
            <div onClick={() => setProfile(p => ({ ...p, organicOnly: !p.organicOnly }))}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 18px", borderRadius: 10, cursor: "pointer", border: `1px solid ${profile.organicOnly ? COLORS.accent : COLORS.border}`, background: profile.organicOnly ? COLORS.accentDim : COLORS.surfaceAlt, marginBottom: 10, transition: "all 0.15s" }}>
              <div>
                <div style={{ color: profile.organicOnly ? COLORS.accent : COLORS.text, fontWeight: 600, fontSize: 14 }}>🌿 Always buy organic</div>
                <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>We'll default to organic options in your list and swaps</div>
              </div>
              <div style={{ width: 20, height: 20, borderRadius: "50%", border: `2px solid ${profile.organicOnly ? COLORS.accent : COLORS.border}`, background: profile.organicOnly ? COLORS.accent : "transparent", flexShrink: 0, transition: "all 0.15s" }} />
            </div>

            {/* Local toggle */}
            <div onClick={() => setProfile(p => ({ ...p, localPreferred: !p.localPreferred }))}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 18px", borderRadius: 10, cursor: "pointer", border: `1px solid ${profile.localPreferred ? COLORS.blue : COLORS.border}`, background: profile.localPreferred ? COLORS.blueDim : COLORS.surfaceAlt, marginBottom: 20, transition: "all 0.15s" }}>
              <div>
                <div style={{ color: profile.localPreferred ? COLORS.blue : COLORS.text, fontWeight: 600, fontSize: 14 }}>🏘️ Prefer local & seasonal</div>
                <div style={{ color: COLORS.muted, fontSize: 12, marginTop: 2 }}>We'll flag locally sourced options when available</div>
              </div>
              <div style={{ width: 20, height: 20, borderRadius: "50%", border: `2px solid ${profile.localPreferred ? COLORS.blue : COLORS.border}`, background: profile.localPreferred ? COLORS.blue : "transparent", flexShrink: 0, transition: "all 0.15s" }} />
            </div>

            {/* Budget disposition */}
            <div style={{ marginBottom: 24 }}>
              <div style={{ color: COLORS.muted, fontSize: 12, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.07em" }}>Price sensitivity</div>
              <div style={{ display: "flex", gap: 8 }}>
                {[
                  { id: "budget", label: "💰 Budget first", desc: "Best price wins" },
                  { id: "balanced", label: "⚖️ Balanced", desc: "Quality + value" },
                  { id: "quality", label: "✨ Quality first", desc: "Best product wins" },
                ].map(opt => (
                  <div key={opt.id} onClick={() => setProfile(p => ({ ...p, budget: opt.id }))}
                    style={{ flex: 1, padding: "12px 10px", borderRadius: 10, cursor: "pointer", textAlign: "center", border: `1px solid ${profile.budget === opt.id ? COLORS.accent : COLORS.border}`, background: profile.budget === opt.id ? COLORS.accentDim : COLORS.surfaceAlt, transition: "all 0.15s" }}>
                    <div style={{ color: profile.budget === opt.id ? COLORS.accent : COLORS.text, fontSize: 12, fontWeight: 700 }}>{opt.label}</div>
                    <div style={{ color: COLORS.muted, fontSize: 11, marginTop: 3 }}>{opt.desc}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={back} style={{ padding: "13px 20px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 14 }}>←</button>
              <div style={{ flex: 1 }}>{nextBtn(false)}</div>
            </div>
          </div>
        )}

        {/* ── STEP: Avoid ── */}
        {step === 3 && (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: COLORS.text, fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Anything you never buy?</h2>
              <p style={{ color: COLORS.muted, fontSize: 13 }}>Ingredients, brands, or products we should never suggest. Skip if none.</p>
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <input
                value={profile.avoidInput}
                onChange={e => setProfile(p => ({ ...p, avoidInput: e.target.value }))}
                onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addAvoid(); } }}
                placeholder="e.g. cilantro, soy, palm oil…"
                style={{ ...inputStyle, flex: 1 }}
              />
              <button onClick={addAvoid} disabled={!profile.avoidInput.trim()}
                style={{ background: COLORS.accentDim, border: `1px solid ${COLORS.accent}`, color: COLORS.accent, borderRadius: 10, padding: "12px 18px", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700, flexShrink: 0 }}>
                Add
              </button>
            </div>
            {profile.avoid.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
                {profile.avoid.map(item => (
                  <div key={item} style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 12px", background: COLORS.warnDim, border: `1px solid ${COLORS.warn}44`, borderRadius: 20, fontSize: 13, color: COLORS.warn }}>
                    {item}
                    <button onClick={() => removeAvoid(item)} style={{ background: "none", border: "none", color: COLORS.warn, cursor: "pointer", fontSize: 14, padding: 0, lineHeight: 1 }}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div style={{ display: "flex", gap: 10, marginTop: profile.avoid.length ? 0 : 20 }}>
              <button onClick={back} style={{ padding: "13px 20px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 14 }}>←</button>
              <div style={{ flex: 1 }}>{nextBtn(false, profile.avoid.length ? `Continue with ${profile.avoid.length} item${profile.avoid.length > 1 ? "s" : ""} →` : "Skip →")}</div>
            </div>
          </div>
        )}

        {/* ── STEP: Done ── */}
        {step === 4 && (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 52, marginBottom: 16 }}>🎉</div>
            <h2 style={{ fontFamily: "'DM Sans',sans-serif", color: COLORS.text, fontSize: 24, fontWeight: 800, marginBottom: 10 }}>
              You're all set{profile.name ? `, ${profile.name.split(" ")[0]}` : ""}!
            </h2>
            <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.7, marginBottom: 28 }}>
              Your preferences are saved. Every recommendation, swap, and shopping list will be tailored to how you shop.
            </p>

            {/* Summary */}
            <div style={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "16px 20px", marginBottom: 28, textAlign: "left" }}>
              {profile.dietary.length > 0 && (
                <div style={{ display: "flex", gap: 10, marginBottom: 10, alignItems: "flex-start" }}>
                  <span style={{ color: COLORS.muted, fontSize: 12, paddingTop: 1, flexShrink: 0 }}>🥦 Diet</span>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                    {profile.dietary.map(d => {
                      const opt = DIETARY_OPTIONS.find(o => o.id === d);
                      return <Tag key={d} color={COLORS.blue}>{opt?.icon} {opt?.label}</Tag>;
                    })}
                  </div>
                </div>
              )}
              {(profile.organicOnly || profile.localPreferred) && (
                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <span style={{ color: COLORS.muted, fontSize: 12 }}>✨ Quality</span>
                  <span style={{ color: COLORS.text, fontSize: 12 }}>
                    {[profile.organicOnly && "Organic preferred", profile.localPreferred && "Local preferred"].filter(Boolean).join(" · ")}
                  </span>
                </div>
              )}
              <div style={{ display: "flex", gap: 10, marginBottom: profile.avoid.length ? 10 : 0 }}>
                <span style={{ color: COLORS.muted, fontSize: 12 }}>💰 Budget</span>
                <span style={{ color: COLORS.text, fontSize: 12 }}>{{ budget: "Budget first", balanced: "Balanced", quality: "Quality first" }[profile.budget]}</span>
              </div>
              {profile.avoid.length > 0 && (
                <div style={{ display: "flex", gap: 10 }}>
                  <span style={{ color: COLORS.muted, fontSize: 12, flexShrink: 0 }}>🚫 Avoid</span>
                  <span style={{ color: COLORS.warn, fontSize: 12 }}>{profile.avoid.join(", ")}</span>
                </div>
              )}
            </div>

            <button onClick={finish}
              style={{ width: "100%", padding: "14px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.accent}`, background: COLORS.accentDim, color: COLORS.accent, fontFamily: "inherit", fontSize: 15, fontWeight: 800 }}>
              Open GrocerySmart →
            </button>
            <button onClick={back} style={{ marginTop: 10, background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 12, textDecoration: "underline" }}>
              Go back and edit
            </button>
          </div>
        )}
      </div>
    </div>
  );
}



// ── Gamified Savings Bar ──────────────────────────────────────────────────────
const MILESTONES = [
  { amount: 10,   label: "First Save",    icon: "🌱", color: "#3fb950" },
  { amount: 25,   label: "Getting Smart", icon: "🧠", color: "#58a6ff" },
  { amount: 50,   label: "Savvy Shopper", icon: "🎯", color: "#bc8cff" },
  { amount: 100,  label: "Deal Hunter",   icon: "🦊", color: "#d29922" },
  { amount: 200,  label: "Budget Pro",    icon: "⚡", color: "#f85149" },
  { amount: 500,  label: "GroceryMaster", icon: "🏆", color: "#FFD700" },
];

function getMilestone(saved) {
  let current = null, next = null;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (saved >= MILESTONES[i].amount) current = MILESTONES[i];
    else { next = MILESTONES[i]; break; }
  }
  return { current, next };
}

function SavingsBar({ totalSaved, monthSaved }) {
  const [expanded, setExpanded] = useState(false);
  const { current, next } = getMilestone(totalSaved);
  const progress = next
    ? ((totalSaved - (current?.amount || 0)) / (next.amount - (current?.amount || 0))) * 100
    : 100;

  return (
    <div
      onClick={() => setExpanded(e => !e)}
      style={{
        background: COLORS.surface, borderBottom: `1px solid ${COLORS.border}`,
        cursor: "pointer", userSelect: "none",
      }}>
      {/* Compact bar */}
      <div style={{ padding: "8px 28px", display: "flex", alignItems: "center", gap: 14 }}>
        {/* Badge */}
        <div style={{
          display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
        }}>
          <span style={{ fontSize: 16 }}>{current?.icon || "🌱"}</span>
          <span style={{ color: current?.color || COLORS.accent, fontSize: 11, fontWeight: 700 }}>
            {current?.label || "New Saver"}
          </span>
        </div>

        <div style={{ color: COLORS.border, fontSize: 12 }}>|</div>

        {/* Progress to next */}
        <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1, height: 5, background: COLORS.surfaceAlt, borderRadius: 4, overflow: "hidden" }}>
            <div style={{
              height: "100%", borderRadius: 4, transition: "width 0.6s ease",
              width: `${Math.min(100, progress)}%`,
              background: next?.color || COLORS.accent,
            }} />
          </div>
          {next && (
            <span style={{ color: COLORS.muted, fontSize: 10, whiteSpace: "nowrap", flexShrink: 0 }}>
              {next.icon} {fmt(next.amount - totalSaved)} to {next.label}
            </span>
          )}
        </div>

        <div style={{ color: COLORS.border, fontSize: 12 }}>|</div>

        {/* This month */}
        <div style={{ flexShrink: 0, textAlign: "right" }}>
          <span style={{ color: COLORS.accent, fontWeight: 800, fontSize: 13 }}>{fmt(monthSaved)}</span>
          <span style={{ color: COLORS.muted, fontSize: 10, marginLeft: 4 }}>this month</span>
        </div>

        <span style={{ color: COLORS.muted, fontSize: 10 }}>{expanded ? "▲" : "▼"}</span>
      </div>

      {/* Expanded milestones panel */}
      {expanded && (
        <div style={{ padding: "12px 28px 16px", borderTop: `1px solid ${COLORS.border}`, background: COLORS.surfaceAlt }}>
          <div style={{ color: COLORS.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.07em", marginBottom: 12 }}>
            Your savings journey · {fmt(totalSaved)} total saved
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {MILESTONES.map(m => {
              const unlocked = totalSaved >= m.amount;
              const isCurrent = current?.amount === m.amount;
              return (
                <div key={m.amount} style={{
                  display: "flex", alignItems: "center", gap: 6,
                  padding: "6px 12px", borderRadius: 20,
                  border: `1px solid ${unlocked ? m.color + "55" : COLORS.border}`,
                  background: isCurrent ? m.color + "20" : unlocked ? m.color + "10" : "transparent",
                  opacity: unlocked ? 1 : 0.35,
                }}>
                  <span style={{ fontSize: 14 }}>{m.icon}</span>
                  <div>
                    <div style={{ color: unlocked ? m.color : COLORS.muted, fontSize: 12, fontWeight: 700 }}>{m.label}</div>
                    <div style={{ color: COLORS.muted, fontSize: 10 }}>{fmt(m.amount)}</div>
                  </div>
                  {isCurrent && <span style={{ fontSize: 9, color: m.color, fontWeight: 800, marginLeft: 2 }}>YOU</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Welcome Tour ──────────────────────────────────────────────────────────────
const TOUR_SLIDES = [
  {
    icon: "📷",
    color: "#58a6ff",
    title: "Snap it. Done.",
    body: "Photo, PDF, or paste your Instacart email. We pull every item, fee, and any sneaky shopper substitutions automatically.",
    detail: "In-store receipts and online orders, handled differently.",
  },
  {
    icon: "📊",
    color: "#bc8cff",
    title: "Know exactly where it goes.",
    body: "Every receipt builds your spending map — by department, by store, by month. The creeping $40 snack habit? It shows up here.",
    detail: "Drill any category down to individual items.",
  },
  {
    icon: "💰",
    color: "#3fb950",
    title: "Real swaps. Real savings.",
    body: "Not generic tips — actual alternatives at stores near you, filtered to what you eat and how you shop. Accept a swap and it lands on your list.",
    detail: "Most people find $40–80/month without changing what they eat.",
  },
  {
    icon: "🛍️",
    color: "#d29922",
    title: "Shop smarter, not longer.",
    body: "Got 20 minutes? One store. Got time? We'll split your list across 3 stops and save you more. You say how much time — we build the route.",
    detail: "Switch between store view and category view mid-trip.",
  },
];

function WelcomeTour({ userName, onDone }) {
  const [slide, setSlide] = useState(0);
  const [exiting, setExiting] = useState(false);
  const current = TOUR_SLIDES[slide];
  const isLast = slide === TOUR_SLIDES.length - 1;

  const advance = () => {
    if (isLast) { onDone(); return; }
    setSlide(s => s + 1);
  };

  const skip = () => onDone();

  return (
    <div style={{
      minHeight: "100vh", background: COLORS.bg,
      fontFamily: "'DM Mono','Fira Code',monospace",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center", padding: "24px",
    }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700;800&display=swap'); * { box-sizing: border-box; margin: 0; padding: 0; }`}</style>

      <div style={{ width: "100%", maxWidth: 500 }}>

        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 40 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 28, height: 28, background: COLORS.accent, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>🛒</div>
            <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 800, fontSize: 14, color: COLORS.text }}>GrocerySmart</span>
          </div>
          <button onClick={skip}
            style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>
            Skip tour →
          </button>
        </div>

        {/* Slide dot indicators */}
        <div style={{ display: "flex", gap: 6, justifyContent: "center", marginBottom: 36 }}>
          {TOUR_SLIDES.map((_, i) => (
            <div key={i} onClick={() => setSlide(i)}
              style={{
                height: 4, borderRadius: 4, cursor: "pointer", transition: "all 0.25s",
                width: i === slide ? 28 : 8,
                background: i === slide ? current.color : COLORS.border,
              }} />
          ))}
        </div>

        {/* Slide content */}
        <div style={{ textAlign: "center", marginBottom: 36 }}>
          {/* Icon bubble */}
          <div style={{
            width: 80, height: 80, borderRadius: 24,
            background: current.color + "18",
            border: `1px solid ${current.color}33`,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 38, margin: "0 auto 24px",
          }}>
            {current.icon}
          </div>

          <h2 style={{
            fontFamily: "'DM Sans',sans-serif", color: COLORS.text,
            fontSize: 22, fontWeight: 800, marginBottom: 14, lineHeight: 1.25,
          }}>
            {current.title}
          </h2>

          <p style={{ color: COLORS.muted, fontSize: 14, lineHeight: 1.75, marginBottom: 16 }}>
            {current.body}
          </p>

          <div style={{
            display: "inline-flex", alignItems: "center", gap: 7,
            background: current.color + "12", border: `1px solid ${current.color}28`,
            borderRadius: 8, padding: "7px 14px",
          }}>
            <span style={{ color: current.color, fontSize: 13 }}>💡</span>
            <span style={{ color: current.color, fontSize: 12 }}>{current.detail}</span>
          </div>
        </div>

        {/* Nav */}
        <div style={{ display: "flex", gap: 10 }}>
          {slide > 0 && (
            <button onClick={() => setSlide(s => s - 1)}
              style={{ padding: "13px 20px", borderRadius: 10, cursor: "pointer", border: `1px solid ${COLORS.border}`, background: "transparent", color: COLORS.muted, fontFamily: "inherit", fontSize: 14 }}>
              ←
            </button>
          )}
          <button onClick={advance}
            style={{
              flex: 1, padding: "13px", borderRadius: 10, cursor: "pointer",
              border: `1px solid ${current.color}`,
              background: current.color + "1a",
              color: current.color,
              fontFamily: "inherit", fontSize: 14, fontWeight: 700,
              transition: "all 0.15s",
            }}>
            {isLast
              ? (userName ? `Let's go, ${userName.split(" ")[0]} →` : "Let's go →")
              : "Next →"}
          </button>
        </div>

        {/* Step counter */}
        <div style={{ textAlign: "center", marginTop: 16, color: COLORS.muted, fontSize: 11 }}>
          {slide + 1} of {TOUR_SLIDES.length}
        </div>
      </div>
    </div>
  );
}


function App() {
  // ── Persisted state — survives refresh ───────────────────────────────────
  const [onboarded,     setOnboarded]     = useLocalStorage("gs_onboarded", false);
  const [tourDone,      setTourDone]      = useLocalStorage("gs_tourDone", false);
  const [userProfile,   setUserProfile]   = useLocalStorage("gs_userProfile", null);
  const [dietary,       setDietary]       = useLocalStorage("gs_dietary", []);
  const [dislikes,      setDislikes]      = useLocalStorage("gs_dislikes", []);
  const [customCats,    setCustomCats]    = useLocalStorage("gs_customCats", [
    { name: "Household & Cleaning", sub: ["Paper Goods", "Detergents", "Trash Bags"], color: "#bc8cff" }
  ]);
  const [savingsProfile, setSavingsProfile] = useLocalStorage("gs_savingsProfile", null);
  const [shoppingList,  setShoppingList]  = useLocalStorage("gs_shoppingList", []);
  const [receipts,      setReceipts]      = useLocalStorage("gs_receipts", []);

  // ── Derived savings totals ────────────────────────────────────────────────
  const totalSaved = receipts.reduce((sum, r) => sum + (r.savedAmount || 0), 0)
    + shoppingList.filter(i => i.optimized && i.checked).reduce((sum, i) => sum + (i.savings || 0), 0);
  const thisMonth  = new Date().toISOString().slice(0, 7); // "2026-03"
  const monthSaved = receipts
    .filter(r => (r.scannedAt || "").startsWith(thisMonth))
    .reduce((sum, r) => sum + (r.savedAmount || 0), 0)
    + shoppingList.filter(i => i.optimized && i.checked && (i.checkedAt || "").startsWith(thisMonth))
      .reduce((sum, i) => sum + (i.savings || 0), 0);

  // ── Non-persisted UI state ────────────────────────────────────────────────
  const [tab, setTab] = useState("scan");

  const handleOnboardingComplete = (profile) => {
    setUserProfile(profile);
    setDietary(profile.dietary || []);
    setDislikes(profile.avoid || []);
    setOnboarded(true);
  };

  if (!onboarded) {
    return <Onboarding onComplete={handleOnboardingComplete} />;
  }

  if (!tourDone) {
    return <WelcomeTour userName={userProfile?.name} onDone={() => setTourDone(true)} />;
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'DM Mono', 'Fira Code', monospace", color: COLORS.text }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700;800&display=swap'); * { box-sizing: border-box; margin: 0; padding: 0; }`}</style>
      <div style={{ borderBottom: `1px solid ${COLORS.border}`, padding: "14px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", background: COLORS.surface, position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 32, height: 32, background: COLORS.accent, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🛒</div>
          <div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontWeight: 800, fontSize: 16, letterSpacing: "-0.02em" }}>GrocerySmart</div>
            <div style={{ color: COLORS.muted, fontSize: 10 }}>RECEIPT TRACKER & SAVINGS ENGINE</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {userProfile?.name && <span style={{ color: COLORS.muted, fontSize: 12 }}>Hi, {userProfile.name.split(" ")[0]} 👋</span>}
          {dietary.length > 0 && <Tag color={COLORS.blue}>{dietary.length} filter{dietary.length > 1 ? "s" : ""}</Tag>}
          <Tag>{receipts.length} receipt{receipts.length !== 1 ? "s" : ""}</Tag>
        </div>
      </div>
      <div style={{ borderBottom: `1px solid ${COLORS.border}`, padding: "10px 28px", display: "flex", gap: 6, flexWrap: "wrap" }}>
        <NavBtn active={tab === "scan"} onClick={() => setTab("scan")}>📷 Scan</NavBtn>
        <NavBtn active={tab === "analysis"} onClick={() => setTab("analysis")}>📊 Analysis</NavBtn>
        <NavBtn active={tab === "savings"} onClick={() => setTab("savings")}>💰 Savings</NavBtn>
        <NavBtn active={tab === "list"} onClick={() => setTab("list")}>🛍️ Shopping List{shoppingList.length > 0 ? ` (${shoppingList.length})` : ""}</NavBtn>
        <NavBtn active={tab === "prefs"} onClick={() => setTab("prefs")}>⚙️ Preferences</NavBtn>
      </div>
      <SavingsBar totalSaved={totalSaved} monthSaved={monthSaved} />
      <div style={{ padding: "28px", maxWidth: 960, margin: "0 auto" }}>
        {tab === "scan" && <ScanTab receipts={receipts} setReceipts={setReceipts} />}
        {tab === "analysis" && <AnalysisTab dietary={dietary} customCats={customCats} receipts={receipts} />}
        {tab === "savings" && <SavingsTab dietary={dietary} savingsProfile={savingsProfile} setSavingsProfile={setSavingsProfile} shoppingList={shoppingList} setShoppingList={setShoppingList} receipts={receipts} />}
        {tab === "list" && <ShoppingListTab shoppingList={shoppingList} setShoppingList={setShoppingList} savingsProfile={savingsProfile} dietary={dietary} userProfile={userProfile} />}
        {tab === "prefs" && <PreferencesTab dietary={dietary} setDietary={setDietary} dislikes={dislikes} setDislikes={setDislikes} customCats={customCats} setCustomCats={setCustomCats} userProfile={userProfile} />}
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
